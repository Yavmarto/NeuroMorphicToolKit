services:
  suite_api:
    image: ghcr.io/yavmarto/neuromorphictoolkit/suite-api:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
      - NEUROCNL_FIREBASE_BUCKET=${NEUROCNL_FIREBASE_BUCKET:-nmtk-41e11.firebasestorage.app}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

  neurosense-hw-worker:
    image: ghcr.io/yavmarto/neuromorphictoolkit/neurosense-hw-worker:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurosense-recordings:/app/recordings
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neurobench-runner-worker:
    image: ghcr.io/yavmarto/neuromorphictoolkit/neurobench-runner-worker:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurobench-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neurochip-hw-worker:
    image: ghcr.io/yavmarto/neuromorphictoolkit/neurochip-hw-worker:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurochip-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
      - NEUROCHIP_LAVA_BACKEND_URL=http://lava-backend:8012
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neurocnl-physics-worker:
    image: ghcr.io/yavmarto/neuromorphictoolkit/neurocnl-physics-worker:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  lava-backend:
    image: ghcr.io/yavmarto/neuromorphictoolkit/lava-backend:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  launcher-control:
    image: ghcr.io/yavmarto/neuromorphictoolkit/launcher-control:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jupyter-server:
    image: ghcr.io/yavmarto/neuromorphictoolkit/jupyter-server:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend-net:
  monitoring-net:

volumes:
  neurobench-data:
  neurochip-data:
  neurosense-recordings:
