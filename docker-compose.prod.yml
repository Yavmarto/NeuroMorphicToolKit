services:
  suite_api:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

  neurosense-hw-worker:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurosense-recordings:/app/recordings
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neurobench-runner-worker:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurobench-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neurochip-hw-worker:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurochip-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
      - NEUROCHIP_LAVA_BACKEND_URL=http://lava-backend:8012
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  neurocnl-physics-worker:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  lava-backend:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  backend-net:
  monitoring-net:

volumes:
  neurobench-data:
  neurochip-data:
  neurosense-recordings:
