services:
  neurocnl:
    restart: always
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    read_only: false # Set to false because FastAPI/Uvicorn might need to write temporary files or logs

  neurocnl-physics:
    restart: always
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
