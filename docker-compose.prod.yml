services:
  neurocnl:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend-net
      - monitoring-net

  neurosim:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

  neurochip:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurochip-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

  neurobench:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurobench-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

  neurosense:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurosense-recordings:/app/recordings
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

  neurohub:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - neurohub-data:/app/data
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend-net
      - backend-net
      - monitoring-net

  neurocnl-physics:
    restart: always
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      - PYTHONOPTIMIZE=1
      - PYTHONUNBUFFERED=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-net
      - monitoring-net

networks:
  frontend-net:
  backend-net:
  monitoring-net:

volumes:
  neurohub-data:
  neurobench-data:
  neurochip-data:
  neurosense-recordings:
