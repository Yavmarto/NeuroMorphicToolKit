name: Auto-Merge Jules PRs

# When Jules opens a PR it always uses a branch prefixed with 'jules/'.
# This workflow enables GitHub's native auto-merge on those PRs so that
# once all required CI status checks pass, GitHub merges automatically —
# no manual intervention needed.
#
# Prerequisites (configure once per repo in Settings):
#   1. Settings → General → "Allow auto-merge" must be enabled
#   2. Settings → Branches → Add a branch protection rule for your default
#      branch that requires at least one status check (your CI job) to pass

on:
  pull_request:
    types: [opened, reopened]

jobs:
  auto-merge:
    # Only Jules PRs — Jules always names branches jules/*
    if: ${{ startsWith(github.head_ref, 'jules/') }}
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto \
            --squash \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
