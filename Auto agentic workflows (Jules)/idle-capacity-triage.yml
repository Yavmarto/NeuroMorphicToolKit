name: Idle Capacity Triage

# When no agent workflow is actively running AND the daily run budget has not
# been reached, this workflow automatically classifies unlabeled GitHub issues
# as 'bug' or 'feature' and assigns a priority (p0 / p1 / p2) so they are
# queued and ready for the next agent work cycle.
#
# Budget control:
#   Set the AGENT_DAILY_RUN_LIMIT repository variable (Settings → Variables)
#   to limit how many agent workflow completions are allowed per day.
#   Default: 20. Set to 0 to disable idle triage entirely.
#
# The triage agent does NOT write any code — it only reads issue text and
# applies labels + posts a brief classification comment.

on:
  schedule:
    - cron: '30 * * * *'   # Runs at :30 past every hour
  workflow_dispatch:

concurrency:
  group: agent-work
  cancel-in-progress: false   # Queue behind any running agent job

jobs:
  triage:
    name: Triage unlabeled issues
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read

    steps:
      # ── Step 1: Gate check — busy? budget? any unlabeled issues? ───────────
      - name: Check capacity and collect unlabeled issues
        id: gate
        uses: actions/github-script@v7
        env:
          AGENT_DAILY_RUN_LIMIT: ${{ vars.AGENT_DAILY_RUN_LIMIT }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const today = new Date().toISOString().split('T')[0];
            const DAILY_LIMIT = parseInt(process.env.AGENT_DAILY_RUN_LIMIT || '20', 10);

            if (DAILY_LIMIT === 0) {
              core.info('AGENT_DAILY_RUN_LIMIT=0 — idle triage disabled.');
              core.setOutput('should_run', 'false');
              core.setOutput('skip_reason', 'Triage disabled (AGENT_DAILY_RUN_LIMIT=0)');
              return;
            }

            // Check: any agent workflow currently in-progress?
            const AGENT_WORKFLOWS = [
              'bug-fixer.yml', 'feature-builder.yml', 'ci-failure-fix.yml',
              'unblocked-issues.yml', 'performance-improver.yml', 'weekly-cleanup.yml',
              'unused-code-remover.yml', 'scaffold-module.yml', 'merge-conflict-resolver.yml',
              'guardrails-updater.yml'
            ];
            const inProgress = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, status: 'in_progress', per_page: 50
            });
            const busyRun = inProgress.data.workflow_runs.find(r =>
              AGENT_WORKFLOWS.some(wf => r.path.includes(wf))
            );
            if (busyRun) {
              core.info(`Agent busy: ${busyRun.name} — skipping triage.`);
              core.setOutput('should_run', 'false');
              core.setOutput('skip_reason', `Agent busy: ${busyRun.name}`);
              return;
            }

            // Check: daily budget
            const completed = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, status: 'completed',
              created: `>=${today}T00:00:00Z`, per_page: 100
            });
            const runsToday = completed.data.workflow_runs.filter(r =>
              AGENT_WORKFLOWS.some(wf => r.path.includes(wf))
            ).length;
            if (runsToday >= DAILY_LIMIT) {
              core.info(`Daily limit reached: ${runsToday}/${DAILY_LIMIT} — skipping triage.`);
              core.setOutput('should_run', 'false');
              core.setOutput('skip_reason', `Daily limit reached (${runsToday}/${DAILY_LIMIT} runs)`);
              return;
            }

            // Collect unlabeled / unclassified issues
            const SKIP_LABELS = new Set([
              'bug', 'feature', 'agent', 'p0', 'p1', 'p2', 'urgent',
              'standup-log', 'wontfix', 'duplicate', 'invalid', 'question',
              'merge-conflict'
            ]);
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const unlabeled = allIssues
              .filter(i => !i.pull_request)
              .filter(i => !i.labels.some(l => SKIP_LABELS.has(l.name)))
              .slice(0, 10);   // Cap at 10 per run — keeps the task focused

            if (unlabeled.length === 0) {
              core.info('No unlabeled issues — nothing to triage.');
              core.setOutput('should_run', 'false');
              core.setOutput('skip_reason', 'No unlabeled issues found');
              return;
            }

            const issueList = unlabeled.map(i =>
              `- #${i.number}: ${i.title}\n  Body preview: ${(i.body || '(empty)').substring(0, 300)}`
            ).join('\n\n');

            core.info(`Found ${unlabeled.length} unlabeled issues. Budget: ${runsToday}/${DAILY_LIMIT}.`);
            core.setOutput('should_run',  'true');
            core.setOutput('issue_list',  issueList);
            core.setOutput('issue_count', String(unlabeled.length));
            core.setOutput('budget_used', `${runsToday}/${DAILY_LIMIT}`);

      # ── Step 2: Checkout (only if gate passed) ─────────────────────────────
      - name: Checkout repo
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Step 3: Invoke Jules to classify and label issues ──────────────────
      - name: Invoke Jules to classify issues
        if: steps.gate.outputs.should_run == 'true'
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            You are a triage agent. The agent pipeline has idle capacity (${{ steps.gate.outputs.budget_used }} runs used today).
            Your task is to classify unlabeled GitHub issues so they are queued correctly
            for the next work cycle.

            ## Issues to Classify

            ${{ steps.gate.outputs.issue_list }}

            ## Classification Instructions

            For each issue, determine:

            **1. Type label** — pick the single best fit:
            - `bug`     — something broken, not working as intended, regression, crash, wrong output
            - `feature` — new capability, enhancement, improvement, or request to add something
            - `question`— support request, asking how something works, unclear ask (do NOT queue for agent)
            - `invalid` — spam, off-topic, or cannot be acted on (do NOT queue for agent)

            **2. Priority label** — for bugs and features only:
            - `p0` — critical: system broken, data loss, security issue, blocking a release
            - `p1` — important: noticeable user impact, should be done this sprint
            - `p2` — low urgency: nice to have, backlog-appropriate

            ## For each bug or feature issue:

            1. Apply the type label:
               `gh issue edit <number> --add-label "<type>" --repo ${{ github.repository }}`

            2. Apply the priority label:
               `gh issue edit <number> --add-label "<priority>" --repo ${{ github.repository }}`

            3. Post a concise classification comment:
               `gh issue comment <number> --body "🤖 **Auto-triage:** ..." --repo ${{ github.repository }}`
               Include: type rationale, priority rationale, and any assumptions made.

            ## For question or invalid issues:

            1. Apply only the `question` or `invalid` label.
            2. Post a comment explaining why it was not queued for the agent.

            ## Constraints

            - Do NOT open any PRs, do NOT modify any code
            - Only use these labels: bug, feature, question, invalid, p0, p1, p2, urgent
            - If an issue already has an open jules/* PR referencing it, skip it
            - Process at most 10 issues per run
            - When in doubt between priorities, go one level lower (err toward p1 over p0)
            - If you cannot confidently classify an issue from its title/body alone, apply
              `question` and ask for clarification in the comment

      # ── Step 4: Log outcome ────────────────────────────────────────────────
      - name: Log result
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.should_run }}" = "false" ]; then
            echo "Triage skipped: ${{ steps.gate.outputs.skip_reason }}"
          else
            echo "Triage completed for ${{ steps.gate.outputs.issue_count }} issues."
          fi
