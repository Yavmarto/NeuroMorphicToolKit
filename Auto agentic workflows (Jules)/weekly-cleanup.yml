name: Weekly Codebase Cleanup

# Enable per-module once it reaches ~70% feature completion.
# Too noisy during active scaffolding and early development.

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: self-hosted
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Invoke Jules for Cleanup
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Please analyze the codebase and perform maintenance tasks.

            ## Focus Areas

            1. **Dead Code Removal**
               - Find unused variables, functions, and classes
               - Remove commented-out code blocks
               - Clean up unreachable code paths

            2. **Code Duplication**
               - Identify duplicated logic blocks
               - Refactor into reusable functions
               - Apply DRY principles where the abstraction is obvious

            3. **Complexity Reduction**
               - Simplify overly complex functions (cyclomatic complexity > 10)
               - Break down large functions into smaller pieces
               - Reduce deeply nested conditionals

            4. **Naming Improvements**
               - Find unclear variable/function names
               - Apply consistent naming conventions (snake_case for Python, camelCase for Dart)

            5. **Code Formatting & Imports**
               - Fix inconsistent indentation
               - Remove unused imports
               - Sort imports where a standard order exists

            ## Guidelines

            - Make incremental, safe refactorings only
            - Preserve all existing functionality and public API contracts
            - Run tests to verify nothing is broken
            - Group related changes into a single focused PR
            - Do NOT open a PR if you do not have a validated and impactful change
