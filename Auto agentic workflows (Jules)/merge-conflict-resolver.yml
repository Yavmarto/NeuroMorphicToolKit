name: Auto-Resolve Merge Conflicts

# Fires in two situations:
#   1. A maintainer adds the 'merge-conflict' label to any PR          → fixes that PR
#   2. A push lands on the default branch                              → scans every open
#      jules/* PR, detects newly-conflicted ones, and fixes each one

on:
  pull_request:
    types: [labeled]

  push:
    branches:
      - main
      - master

jobs:

  # ── Trigger 1: maintainer adds the 'merge-conflict' label to a PR ──────────
  resolve-labeled-pr:
    name: Resolve conflict on labeled PR
    if: >
      github.event_name == 'pull_request' &&
      github.event.label.name == 'merge-conflict' &&
      contains(fromJSON('["your-github-username"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Detect conflicted files
        id: detect
        run: |
          # Attempt a dry-run merge to surface conflict markers without committing
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}" || true
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          git merge --abort 2>/dev/null || true

          if [ -z "$CONFLICTS" ]; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true"  >> "$GITHUB_OUTPUT"
            echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICTS"          >> "$GITHUB_OUTPUT"
            echo "EOF"                 >> "$GITHUB_OUTPUT"
          fi

      - name: Invoke Jules to resolve conflicts
        if: steps.detect.outputs.has_conflicts == 'true'
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            This PR has merge conflicts that need to be resolved.

            **PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
            **Head branch (this PR):** ${{ github.event.pull_request.head.ref }}
            **Base branch (merge target):** ${{ github.event.pull_request.base.ref }}

            **Conflicted files:**
            ${{ steps.detect.outputs.conflict_files }}

            Resolution process:
            1. Run `git merge origin/${{ github.event.pull_request.base.ref }}` to reproduce the conflict markers in the working tree.
            2. Read each conflicted file listed above.
            3. For every conflict block (`<<<<<<< HEAD` … `=======` … `>>>>>>> origin/…`):
               - Understand the intent of BOTH sides.
               - Prefer the HEAD (this PR) logic for changes introduced by this PR.
               - Preserve base-branch changes that are unrelated to this PR's scope.
               - If both sides changed the same logic, merge them semantically — do NOT simply pick one side.
            4. After resolving all markers, run the test suite to verify nothing is broken.
            5. Stage all resolved files with `git add`.
            6. Commit with the message: `fix: resolve merge conflicts with ${{ github.event.pull_request.base.ref }}`
            7. Push to the existing branch **${{ github.event.pull_request.head.ref }}** (do NOT create a new branch).
            8. Use the 'gh' CLI to add a PR comment that lists:
               - Which files had conflicts.
               - A brief explanation of how each conflict was resolved.
               - Confirmation that the test suite passed.

            Constraints:
            - Do NOT change any logic that was not part of a conflict block.
            - Do NOT squash or rebase — only resolve conflicts and commit.
            - If the conflict is in a lock file (package-lock.json, yarn.lock, Pipfile.lock, pubspec.lock),
              regenerate it with the appropriate package manager instead of editing it manually.
            - If a conflict cannot be resolved confidently, leave a TODO comment and note it in the PR comment.

      - name: Remove merge-conflict label on success
        if: steps.detect.outputs.has_conflicts == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "merge-conflict" \
            --repo "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment — no conflict found
        if: steps.detect.outputs.has_conflicts == 'false'
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "🟢 **Merge Conflict Resolver:** No conflict markers detected against \`$BASE_BRANCH\`. The PR appears clean." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

  # ── Trigger 2: push to default branch → scan all open jules/* PRs ───────────
  scan-and-resolve-on-push:
    name: Scan jules/* PRs for new conflicts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Find conflicted jules/* PRs and resolve each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          # Fetch all open jules/* PRs
          PRS=$(gh pr list \
            --state open \
            --json number,headRefName,title,baseRefName \
            --jq '.[] | select(.headRefName | startswith("jules/")) | @json')

          if [ -z "$PRS" ]; then
            echo "No open jules/* PRs found. Nothing to do."
            exit 0
          fi

          echo "$PRS" | while IFS= read -r PR_JSON; do
            PR_NUMBER=$(echo "$PR_JSON"  | jq -r '.number')
            HEAD_REF=$(echo "$PR_JSON"   | jq -r '.headRefName')
            BASE_REF=$(echo "$PR_JSON"   | jq -r '.baseRefName')
            PR_TITLE=$(echo "$PR_JSON"   | jq -r '.title')

            echo "──────────────────────────────────────────"
            echo "Checking PR #$PR_NUMBER ($HEAD_REF → $BASE_REF): $PR_TITLE"

            git fetch origin "$HEAD_REF" "$BASE_REF" 2>/dev/null || {
              echo "Could not fetch branches for PR #$PR_NUMBER — skipping."
              continue
            }
            git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

            git merge --no-commit --no-ff "origin/$BASE_REF" 2>/dev/null || true
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort 2>/dev/null || true

            if [ -z "$CONFLICTS" ]; then
              echo "PR #$PR_NUMBER is clean — no conflicts."
              continue
            fi

            echo "PR #$PR_NUMBER has conflicts in:"
            echo "$CONFLICTS"

            # Note: For batch PR resolution, use gh CLI or jules-invoke action directly.
            # Jules will handle conflict resolution when invoked on the specific PR branch.
            echo "PR #$PR_NUMBER requires conflict resolution — please apply the 'merge-conflict' label to trigger Jules."

            # Return to default branch before next iteration
            git checkout "$DEFAULT_BRANCH"
          done
