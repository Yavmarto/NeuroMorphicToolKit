name: Work on Unblocked Issues

# When an issue is closed (e.g. a dependency is resolved), this workflow
# detects any issues that were blocked by it and kicks off the agent to
# implement them automatically.
#
# To mark an issue as blocked, add a line to its body:
#   blocked-by: #123

on:
  issues:
    types: [closed]

jobs:
  detect-unblocked:
    runs-on: self-hosted
    permissions:
      issues: read
    outputs:
      matrix: ${{ steps.finder.outputs.issues }}
      found: ${{ steps.finder.outputs.has_issues }}
    steps:
      - name: Find Unblocked Issues
        id: finder
        uses: google-labs-code/on-unblocked@v1

  implement:
    needs: detect-unblocked
    if: needs.detect-unblocked.outputs.found == 'true'
    runs-on: self-hosted
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write
    strategy:
      matrix:
        issue-number: ${{ fromJson(needs.detect-unblocked.outputs.matrix) }}

    steps:
      - name: Get issue details
        id: get_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ matrix.issue-number }}
            });
            return issue.data;

      - name: Invoke Jules on Unblocked Issue
        # SECURITY: Only implement issues filed by trusted maintainers
        if: ${{ contains(fromJSON('["your-github-username"]'), fromJson(steps.get_issue.outputs.result).user.login) }}
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            A previously blocked issue is now unblocked and ready for implementation:

            ## ${{ fromJson(steps.get_issue.outputs.result).title }}

            ${{ fromJson(steps.get_issue.outputs.result).body }}

            This issue was waiting on a dependency that has just been resolved.
            Please implement it now, following the project's coding standards.
            Add tests and open a pull request.
