name: Build Feature

on:
  issues:
    types: [labeled]

jobs:
  build-feature:
    # Triggers on 'feature' or 'agent' label — use 'feature' for planned work,
    # 'agent' for direct implementation requests
    if: ${{ github.event.label.name == 'feature' || github.event.label.name == 'agent' }}
    runs-on: ubuntu-latest
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Invoke Jules to build feature
        # SECURITY: Only allow trusted maintainers to trigger Jules via label
        # (checks who added the label, not who filed the issue)
        if: ${{ contains(fromJSON('["your-github-username"]'), github.event.sender.login) }}
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Implement the following feature:

            ## ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Implementation Guidelines:
            1. **Understand** - Read the issue carefully, identify scope and acceptance criteria
            2. **Plan** - Identify which files need to change and why
            3. **Implement** - Write clean, idiomatic code following existing conventions
            4. **Test** - Add or update tests to cover the new functionality
            5. **PR** - Open a pull request with a clear description of what changed and why

            Constraints:
            - Follow existing code style and architecture patterns
            - Do not break existing tests
            - Keep changes focused — only change what is needed for this feature
            - If the issue is ambiguous, make the most reasonable interpretation
              and document your assumption in the PR body
