name: Guardrails Updater

# Closes the learning loop from the Research-Spec-driven-development framework.
# When a jules/* PR is closed WITHOUT merging (rejected by a reviewer or
# abandoned), this workflow:
#   1. Reads the review comments and rejection context
#   2. Asks Jules to distil the failure into a concrete new guardrail
#   3. Appends the guardrail to GUARDRAILS.md
#   4. Opens a small PR for human review before it becomes permanent
#
# Over time, GUARDRAILS.md grows into an institutional memory file that is
# injected into every future agent session via sdd-context-bridge.yml,
# preventing the same class of mistake from recurring.
#
# Also supports manual trigger (workflow_dispatch) for documenting failures
# that happened outside the normal PR flow.

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      failure_description:
        description: "Describe what went wrong (free text — for manual guardrail creation)"
        required: true
        type: string

jobs:
  update-guardrails:
    name: Distil guardrail from rejected PR
    # Only fires for:
    #   - jules/* PRs that were CLOSED without merging (rejected / abandoned)
    #   - Manual workflow_dispatch triggers
    if: >
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'jules/') &&
       github.event.pull_request.merged == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      # ── Collect everything that explains why the PR was rejected ───────────
      - name: Collect rejection context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            // Manual dispatch — use the provided description directly
            if (context.eventName === 'workflow_dispatch') {
              const desc = context.payload.inputs.failure_description;
              core.setOutput('failure_context', `Manual guardrail request:\n\n${desc}`);
              core.setOutput('pr_number', 'manual');
              core.setOutput('pr_branch', 'manual');
              core.setOutput('closed_at', new Date().toISOString());
              return;
            }

            const owner    = context.repo.owner;
            const repo     = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prTitle  = context.payload.pull_request.title;
            const prBody   = context.payload.pull_request.body || '(no description)';
            const prBranch = context.payload.pull_request.head.ref;
            const closedAt = context.payload.pull_request.closed_at;

            // Formal review decisions (APPROVED / CHANGES_REQUESTED / DISMISSED)
            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });
            const reviewSummary = reviews.data
              .filter(r => r.body && r.body.trim())
              .map(r => `[${r.state}] @${r.user.login}: ${r.body}`)
              .join('\n') || '(no formal reviews submitted)';

            // Inline code review comments (most specific feedback)
            const inlineComments = await github.rest.pulls.listReviewComments({
              owner, repo, pull_number: prNumber
            });
            const inlineSummary = inlineComments.data
              .filter(c => c.body && c.body.trim())
              .map(c => `File \`${c.path}\` line ${c.line || '?'} — @${c.user.login}:\n  ${c.body}`)
              .join('\n---\n') || '(no inline comments)';

            // General PR discussion comments (excluding bots)
            const issueComments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const discussionSummary = issueComments.data
              .filter(c => !c.user.login.includes('[bot]') && c.body.trim())
              .map(c => `@${c.user.login}: ${c.body}`)
              .join('\n') || '(no discussion comments)';

            const failureContext = [
              `## Rejected PR`,
              ``,
              `**PR #${prNumber}:** ${prTitle}`,
              `**Branch:** ${prBranch}`,
              `**Closed at:** ${closedAt}`,
              ``,
              `### PR Description`,
              prBody,
              ``,
              `### Formal Review Decisions`,
              reviewSummary,
              ``,
              `### Inline Code Review Comments`,
              inlineSummary,
              ``,
              `### Discussion`,
              discussionSummary,
            ].join('\n');

            core.setOutput('failure_context', failureContext);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('pr_branch', prBranch);
            core.setOutput('closed_at', closedAt);
            core.info(`Collected rejection context for PR #${prNumber}`);

      # ── Ask Jules to distil the lesson and append it to GUARDRAILS.md ─────
      - name: Invoke Jules to distil guardrail and append to GUARDRAILS.md
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            An agent-generated PR was rejected and closed without merging.
            Your job is to extract the lesson and add it as a new guardrail
            to GUARDRAILS.md so that future agents do not repeat this mistake.

            ## Rejection Context

            ${{ steps.context.outputs.failure_context }}

            ## Instructions

            ### Step 1 — Understand the failure
            Read the review comments carefully. Identify the root cause:
            - Wrong technical approach (used wrong library, wrong pattern, over-engineered)
            - Violated a project convention (wrong ORM, wrong framework usage, wrong naming)
            - Broke something unrelated (modified public API, removed a test, changed a config)
            - Logic error caught by review that passed CI (off-by-one, wrong condition, wrong field)
            - Missed a requirement from the issue
            - Scope creep (changed more than was asked)

            ### Step 2 — Read GUARDRAILS.md
            Open the file and find the highest "Sign #N" heading to determine the next
            sequence number. If GUARDRAILS.md does not exist, create it with this header:

            ```markdown
            # GUARDRAILS

            This file records known failure patterns from previous agent sessions.
            Each Sign is a concrete mistake an agent made in this repository.
            Read all Signs before starting any task and do not repeat them.

            ---
            ```

            ### Step 3 — Write the new guardrail
            Append the following block to GUARDRAILS.md (increment N from the highest
            existing Sign number, or use Sign #1 if the file is new):

            ```markdown
            ## Sign #<N>: <Short imperative title — 5-10 words>

            **What happened:** <1-2 sentences: the specific mistake the agent made>
            **Root cause:** <1 sentence: why the agent made this mistake>
            **Rule:** <The constraint in imperative form — "DO NOT...", "ALWAYS USE...", "NEVER...">
            **Source:** PR #${{ steps.context.outputs.pr_number }}, closed ${{ steps.context.outputs.closed_at }}

            ---
            ```

            ### Step 4 — Scope check
            If the PR was closed for non-quality reasons (e.g. "wrong issue",
            "already fixed elsewhere", "out of scope"), write a guardrail about
            scope management rather than a technical rule. Example:
            "Always verify the issue is still open and unresolved before starting work."

            ### Step 5 — Check for duplicates
            If an identical or very similar guardrail already exists, do NOT add a
            duplicate. Instead, amend the existing Sign to add a note:
            "Also observed in PR #${{ steps.context.outputs.pr_number }}."

            ### Step 6 — Open a PR
            1. Create a new branch: `jules/guardrails-sign-<N>`
            2. Commit GUARDRAILS.md with: `docs: add guardrail sign #<N>`
            3. Push and open a PR with:
               - Title: `📚 Add guardrail Sign #<N>: <title>`
               - Body: a one-paragraph explanation of what was learned and the source PR

            ## Constraints
            - Only modify GUARDRAILS.md — no other files
            - Keep guardrails precise and actionable, not vague platitudes
            - Maximum 1 new Sign per rejected PR (distil to the single most important lesson)
            - Do NOT add a guardrail if the review comments are too vague to extract a
              specific, actionable rule — post a PR comment explaining this instead
