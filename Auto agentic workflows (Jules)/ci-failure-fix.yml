name: Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ["CI"]  # Must match the exact name of your CI workflow
    types: [completed]

jobs:
  fix-failure:
    # Only run when CI fails
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: Download workflow logs
        uses: actions/github-script@v7
        id: get-logs
        with:
          script: |
            const logs = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            return logs.url;

      - name: Invoke Jules to fix CI failure
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            The CI workflow "${{ github.event.workflow_run.name }}" has failed.

            **Failed Run:** ${{ github.event.workflow_run.html_url }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}

            Please:
            1. Analyze the failure by reading the workflow run linked above
            2. Identify the root cause (broken test, missing dependency, type error, etc.)
            3. Implement a focused fix — do not refactor unrelated code
            4. Ensure the fix will pass CI before opening a PR
