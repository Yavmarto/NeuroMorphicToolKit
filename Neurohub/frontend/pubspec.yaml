name: neurohub_frontend
description: "Flutter frontend package for the Neurohub module (GitHub device-flow connect screen)."
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  http: ^1.2.0
  nmtk_module_contracts:
    path: ../../nmtk_module_contracts
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
