steps:
  # ── 1. Build and push the backend Docker image ───────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api:${SHORT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api:latest"
      - "."
    dir: "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    waitFor: ["build-backend"]
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api"

  # ── 2. Run Alembic migrations before deploying the new image ─────────────
  # Uses Cloud Run Jobs for a one-off migration execution.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "run-migrations"
    waitFor: ["push-backend"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "jobs"
      - "execute"
      - "neurohub-migrate"
      - "--region=${_REGION}"
      - "--wait"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api:${SHORT_SHA}"

  # ── 3. Deploy the new image to Cloud Run ─────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    waitFor: ["run-migrations"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "neurohub-api"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"  # Firebase Hosting proxy handles public access
      - "--service-account=neurohub-api@${PROJECT_ID}.iam.gserviceaccount.com"

  # ── 4. Build the Flutter web SPA ─────────────────────────────────────────
  # SUPABASE_URL/SUPABASE_ANON_KEY are public, non-secret values (the anon
  # key is designed to be embedded in clients) — no Secret Manager entry
  # needed, unlike the Firebase CI token below. Both dart-defines are only
  # here for explicitness; if omitted, main.dart falls back to its own
  # hardcoded defaults for the same project.
  - name: "ghcr.io/cirruslabs/flutter:stable"
    id: "build-frontend"
    waitFor: ["-"]  # Run in parallel with backend build
    args:
      - "build"
      - "web"
      - "--release"
      - "--dart-define=SUPABASE_URL=https://YOUR_PROJECT_REF.supabase.co"
      - "--dart-define=SUPABASE_ANON_KEY=YOUR_ANON_KEY"
    dir: "frontend"

  # ── 5. Deploy Flutter SPA to Firebase Hosting ───────────────────────────
  - name: "gcr.io/firebase-ci/firebase-tools:latest"
    id: "deploy-hosting"
    waitFor: ["build-frontend", "deploy-backend"]
    args:
      - "deploy"
      - "--only"
      - "hosting"
      - "--project=${PROJECT_ID}"
    dir: "."
    secretEnv: ["FIREBASE_TOKEN"]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/neurohub-api:latest"

availableSecrets:
  secretManager:
    # Firebase Hosting is used here purely as static-site hosting + a
    # reverse proxy to Cloud Run — unrelated to auth (Firebase Auth was
    # removed; NEUROHUB_AUTH_PROVIDER=supabase throughout). This token is
    # Firebase's CI deploy credential, not an identity-provider secret.
    - versionName: "projects/${PROJECT_ID}/secrets/firebase-ci-token/versions/latest"
      env: "FIREBASE_TOKEN"

substitutions:
  _REGION: "europe-west1"
  _REPO: "neurohub"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
