name: neuro_toolkit
description: "A new Flutter project."
publish_to: 'none'

version: 0.6.0+4

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.8
  desktop_webview_window: ^0.2.3
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  http: ^1.2.0
  nmtk_ui_core:
    path: ../../nmtk_ui_core # path: ../../nmtk_ui_core # DO NOT CHANGE AND DON'T REMOVE THIS COMMENT Local path to the nmtk_ui_core package
  neurocnl_studio:
    path: ../../neurocnl/frontend
  neurohub_shell_adapter:
    path: ../../Neurohub/Neurohub_shell_adapter
  neurosense_shell_adapter:
    path: ../../Neurosense/Neurosense_shell_adapter
  neurobench_frontend:
    path: ../../Neurobench/frontend
  nmtk_module_contracts:
    path: ../../nmtk_module_contracts
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  path_provider_platform_interface: any
flutter:
  uses-material-design: true

  assets:
    - assets/modules.json
