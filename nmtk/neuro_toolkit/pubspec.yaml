name: neuro_toolkit
description: "A new Flutter project."
publish_to: 'none'

version: 0.6.5+9

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  animations: ^2.0.11
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dartssh2: ^2.22.3
  desktop_webview_window: ^0.2.3
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  go_router: ^14.0.0
  http: ^1.2.0
  neurobench_frontend:
    path: ../../Neurobench/frontend
  neurocnl_studio:
    path: ../../neurocnl/frontend
  neurohub_shell_adapter:
    path: ../../Neurohub/Neurohub_shell_adapter
  neurosense_shell_adapter:
    path: ../../Neurosense/Neurosense_shell_adapter
  nmtk_module_contracts:
    path: ../../nmtk_module_contracts
  nmtk_ui_core:
    path: ../../nmtk_ui_core # path: ../../nmtk_ui_core # DO NOT CHANGE AND DON'T REMOVE THIS COMMENT Local path to the nmtk_ui_core package
  package_info_plus: ^9.0.1
  path: ^1.9.0
  path_provider: ^2.1.2
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  yaml: ^3.1.3
  zeta_flutter: any
dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  path_provider_platform_interface: any
  riverpod_generator: ^4.0.3
flutter:
  uses-material-design: true

  assets:
    - assets/modules.json
    - assets/custom_node_editor.html
    - assets/deployment/
    - assets/deployment/monitoring/alertmanager/
    - assets/deployment/monitoring/loki/
    - assets/deployment/monitoring/prometheus/
    - assets/deployment/monitoring/promtail/
