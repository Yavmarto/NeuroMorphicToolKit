global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

scrape_configs:
  - job_name: 'nmtk-services'
    static_configs:
      - targets:
          - 'suite_api:9000'
          # Optional worker services: uncomment or configure via service discovery if workers are enabled
          # - 'neurosense-hw-worker:8004'
          # - 'neurobench-runner-worker:8003'
          # - 'neurochip-hw-worker:8002'
          # - 'neurocnl-physics-worker:8006'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'
