services:

  suite_api:
    build:
      context: .
      dockerfile: suite_api/Dockerfile
    ports:
      - "${SUITE_API_PORT:-9000}:9000"
    environment:
      - PYTHONUNBUFFERED=1
      # Phase 4 worker URLs — must match Docker service names when profiles are active
      - NEUROSENSE_HW_WORKER_URL=http://neurosense-hw-worker:8004
      - NEUROBENCH_RUNNER_URL=http://neurobench-runner-worker:8003
      - NEUROCHIP_HW_WORKER_URL=http://neurochip-hw-worker:8002
      - NEUROCNL_PHYSICS_WORKER_URL=http://neurocnl-physics-worker:8006
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api/suite/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
      - monitoring-net

  # ── Phase 4 workers — started only with the matching Docker Compose profile ──

  neurosense-hw-worker:
    build:
      context: ./workers/neurosense_hw
    ports:
      - "${NEUROSENSE_PORT:-8004}:8004"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/repo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
    profiles:
      - hardware

  neurobench-runner-worker:
    build:
      context: ./workers/neurobench_runner
    ports:
      - "${NEUROBENCH_PORT:-8003}:8003"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/repo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
    profiles:
      - jobs

  neurochip-hw-worker:
    build:
      context: ./workers/neurochip_hw
    ports:
      - "${NEUROCHIP_PORT:-8002}:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - NEUROCHIP_LAVA_BACKEND_URL=http://lava-backend:8012
    volumes:
      - .:/repo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on:
      - lava-backend
    networks:
      - backend-net
    profiles:
      - hardware

  lava-backend:
    build:
      context: .
      dockerfile: Dockerfile.lava
    ports:
      - "${LAVA_BACKEND_PORT:-8012}:8012"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
    profiles:
      - hardware

  neurocnl-physics-worker:
    build:
      context: ./workers/neurocnl_physics
    ports:
      - "${NEUROCNL_PHYSICS_PORT:-8006}:8006"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/repo:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net
    profiles:
      - physics

  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - monitoring-net
    profiles:
      - monitoring

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - monitoring-net
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-net
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:9.5.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring-net
    profiles:
      - monitoring
    depends_on:
      - prometheus
      - loki

  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - monitoring-net
    profiles:
      - monitoring

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
