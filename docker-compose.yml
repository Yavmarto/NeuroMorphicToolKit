services:
  neurocnl:
    build:
      context: .
      dockerfile: neurocnl/backend/Dockerfile
    ports:
      - "${NEUROCNL_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    # No profiles = starts by default (Core)

  neurocnl-physics:
    build:
      context: .
      dockerfile: neurocnl/backend/Dockerfile
      args:
        INSTALL_PHYSICS: 1
    ports:
      - "${NEUROCNL_PHYSICS_PORT:-8006}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - physics

  neurosim:
    build:
      context: .
      dockerfile: Neurosim/Dockerfile
    ports:
      - "${NEUROSIM_PORT:-8001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    # No profiles = starts by default (Core)

  neurochip:
    build:
      context: .
      dockerfile: Neurochip/Dockerfile
    ports:
      - "${NEUROCHIP_PORT:-8002}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    # No profiles = starts by default (Core)

  neurobench:
    build:
      context: .
      dockerfile: Neurobench/Dockerfile
    ports:
      - "${NEUROBENCH_PORT:-8003}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - full

  neurosense:
    build:
      context: .
      dockerfile: Neurosense/Dockerfile
    ports:
      - "${NEUROSENSE_PORT:-8004}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - full

  neurohub:
    build:
      context: .
      dockerfile: Neurohub/Dockerfile
    ports:
      - "${NEUROHUB_PORT:-8005}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NEUROSIM_URL=${NEUROSIM_URL:-http://neurosim:8000}
      - NEUROCHIP_URL=${NEUROCHIP_URL:-http://neurochip:8000}
      - NEUROBENCH_URL=${NEUROBENCH_URL:-http://neurobench:8000}
      - NEUROSENSE_URL=${NEUROSENSE_URL:-http://neurosense:8000}
      - NEUROCNL_URL=${NEUROCNL_URL:-http://neurocnl:8000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - full
    depends_on:
      neurocnl:
        condition: service_healthy
      neurosim:
        condition: service_healthy
      neurochip:
        condition: service_healthy
      neurobench:
        condition: service_healthy
      neurosense:
        condition: service_healthy

networks:
  nmtk-network:
    driver: bridge
