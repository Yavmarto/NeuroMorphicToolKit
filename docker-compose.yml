services:
  neurocnl:
    build:
      context: ./neurocnl
      dockerfile: backend/Dockerfile
    ports:
      - "${NEUROCNL_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    # No profiles = starts by default (Core)

  neurocnl-physics:
    build:
      context: ./neurocnl
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PHYSICS: 1
    ports:
      - "${NEUROCNL_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - physics

  neurosim:
    build:
      context: ./Neurosim
      dockerfile: Dockerfile
    ports:
      - "${NEUROSIM_PORT:-8001}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    # No profiles = starts by default (Core)

  neurochip:
    build:
      context: ./Neurochip
      dockerfile: Dockerfile
    ports:
      - "${NEUROCHIP_PORT:-8002}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    # No profiles = starts by default (Core)

  neurobench:
    build:
      context: ./Neurobench
      dockerfile: Dockerfile
    ports:
      - "${NEUROBENCH_PORT:-8003}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - full

  neurosense:
    build:
      context: ./Neurosense
      dockerfile: Dockerfile
    ports:
      - "${NEUROSENSE_PORT:-8004}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - full

  neurohub:
    build:
      context: ./Neurohub
      dockerfile: Dockerfile
    ports:
      - "${NEUROHUB_PORT:-8005}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/neurohub/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nmtk-network
    profiles:
      - full
    depends_on:
      neurocnl:
        condition: service_healthy
      neurosim:
        condition: service_healthy
      neurochip:
        condition: service_healthy
      neurobench:
        condition: service_healthy
      neurosense:
        condition: service_healthy

networks:
  nmtk-network:
    driver: bridge
