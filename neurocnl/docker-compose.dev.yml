version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./neurocnl:/app/neurocnl
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=*
    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir backend
      --reload-dir neurocnl
