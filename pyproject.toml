[tool.pytest.ini_options]
# asyncio_mode = "auto" lets every async test function and fixture run without
# an explicit @pytest.mark.asyncio decorator.  asyncio_default_fixture_loop_scope
# prevents the deprecation warning from pytest-asyncio >= 0.23 about implicit
# session-scoped loop reuse.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pytest-nengo triggers a broken matplotlib import at collection time in this
# environment; disable it at root level so all root-level test runs work.
addopts = "-p no:nengo"
# Repo root on the import path so nmtk_sdk and other root-level packages are importable.
pythonpath = ["."]

markers = [
    "golden_path: Full golden-path integration tests (author → validate → simulate → inspect → persist). Requires neurocnl + neurobench services to be running.",
    "pynq_hardware: Hardware-only tests for the PYNQ-Z2 (sc-neurocore) FPGA board. Skipped unless PYNQ_HARDWARE_TEST=true. Must run on a self-hosted runner with the board physically attached.",
    "akida_hardware: Hardware-only tests for a physical BrainChip AKida device (USB). Skipped unless AKIDA_HARDWARE_TEST=true. Must run on a self-hosted runner with the USB chip enumerated.",
]

[tool.ruff.lint]
# Per-file suppressions for intentional E402 (module-level import not at top).
# Each entry is documented with the reason the late import is required.
[tool.ruff.lint.per-file-ignores]
# server.py uses a deliberate partial-initialisation import pattern: mixin modules
# import constants from server.py, so they must be loaded AFTER those constants are
# defined.  Moving these imports to the top would re-introduce the circular import
# that this pattern was designed to avoid. Furthermore, many of these imports are
# only exposed for use by other modules and test mocks, triggering F401.
"nmtk/launcher_control/server.py" = ["E402", "F401"]
# neurosense_hw/main.py appends a runtime path to sys.path before importing the
# neurosense package — the import cannot precede the path setup.
"workers/neurosense_hw/main.py" = ["E402"]
# cli.py reconfigures stdout/stderr encoding (for Windows cp1252 compat) before
# any code prints — that initialisation must precede all other imports.
".agents/skills/caveman-compress/scripts/cli.py" = ["E402"]
