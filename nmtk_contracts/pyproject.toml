[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nmtk-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for the NMTK service modules."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0.0"]

[tool.setuptools.packages.find]
include = ["nmtk_contracts*"]
