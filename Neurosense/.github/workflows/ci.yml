name: CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - "neurosense/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "Dockerfile"
  pull_request:
    branches: [ main, dev ]
    paths:
      - "neurosense/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "Dockerfile"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Add Git to PATH (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
    - uses: actions/checkout@v4

    - name: Configure tool cache
      shell: bash
      run: |
        TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
        mkdir -p "$TOOL_CACHE"
        echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
        echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
    - name: Install Python via Homebrew (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install python@3.11 || true
        echo "$(brew --prefix python@3.11)/bin" >> "$GITHUB_PATH"

    - name: Set up Python 3.11
      if: runner.os != 'macOS'
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
      env:
        AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with Mypy
      run: |
        mypy neurosense/
        mypy --strict neurosense/

    - name: Run Tests with Pytest
      run: |
        pytest

    - name: Run CDD Contract Tests
      run: |
        pytest neurosense/tests/test_contracts.py

    - name: Run Property Tests
      run: |
        pytest neurosense/tests/properties/

    - name: Run Integration Smoke Test
      run: |
        PYTHONPATH=. pytest neurosense/tests/test_smoke.py

    - name: Upload Smoke Test Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-artifacts-${{ matrix.os[0] }}-${{ matrix.os[1] }}-${{ matrix.os[2] }}
        path: |
          recordings_smoke_test/
          *.log
        retention-days: 5

  test-frontend:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
          if exist "C:\Program Files\Git\bin\git.exe" echo C:\Program Files\Git\bin>>%GITHUB_PATH%
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" echo C:\Program Files (x86)\Git\cmd>>%GITHUB_PATH%

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze
        run: |
          cd frontend
          flutter analyze

      - name: Run tests
        run: |
          cd frontend
          flutter test

  cdd-pbt:
    uses: neuro-space/.github/.github/workflows/cdd-pbt.yml@main
