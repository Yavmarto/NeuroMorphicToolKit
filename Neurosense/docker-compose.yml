version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: Neurosense/Dockerfile
    ports:
      - "8004:8000"
    volumes:
      - ./neurosense:/app/neurosense
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
