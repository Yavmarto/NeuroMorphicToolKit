global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

scrape_configs:
  - job_name: 'nmtk-services'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'suite_api:9000'
          - 'launcher-control:8091'
          - 'neurobench-runner-worker:8003'
          - 'neurochip-hw-worker:8002'
          - 'neurocnl-physics-worker:8006'
          - 'lava-backend:8012'
          - 'brian2-backend:8013'
          - 'snn-mlir-compiler:8007'
          - 'jupyter-server:8008'
          - 'neurosense-hw-worker:8004'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'
