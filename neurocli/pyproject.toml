[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocli"
version = "0.1.0"
description = "NMTK command-line front door — scaffolding, module lifecycle, and hub commands"
requires-python = ">=3.10"
dependencies = [
    "typer==0.12.3",
    "jinja2==3.1.4",
    "httpx==0.27.0",
]

[project.scripts]
neuro = "neurocli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-mock==3.14.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["neurocli"]
include = ["neurocli/templates/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Typer 0.12 does not support X | None syntax in Option/Argument annotations
"neurocli/new.py" = ["UP045"]
"neurocli/lifecycle.py" = ["UP045"]
"neurocli/hub.py" = ["UP045"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
