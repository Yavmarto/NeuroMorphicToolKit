[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurocli"
version = "0.1.0"
description = "NMTK command-line front door — scaffolding, module lifecycle, and hub commands"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "typer==0.12.3",
    "httpx==0.27.0",
]

[project.scripts]
neuro = "neurocli.cli:app"

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-mock==3.14.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["neurocli"]
include = ["neurocli/templates/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008",
    "D101",
    "D103",
    "ANN101",
    "ANN401",
    "E501",
    "E402",
    "F841",
    "D417",
    "D205",
    "D102",
    "D415",
]


[tool.mypy]
disable_error_code = ["type-arg", "no-any-return", "arg-type", "attr-defined", "assignment", "index", "operator", "call-arg", "dict-item", "list-item", "name-defined", "no-untyped-call", "no-untyped-def", "var-annotated", "import-untyped"]
warn_unused_ignores = false
disallow_untyped_decorators = false
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint.per-file-ignores]
"neurocli/neurocli/new.py" = ["UP007"]
"neurocli/neurocli/lifecycle.py" = ["UP007"]
"neurocli/neurocli/hub.py" = ["UP007"]
