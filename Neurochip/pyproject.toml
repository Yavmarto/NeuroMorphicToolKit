[tool.poetry]
name = "neurochip"
version = "0.6.0"
description = "Hardware Deployment & Compilation Toolkit"
authors = ["Neuro-space <contact@neuro-space.local>"]
license = "AGPL-3.0-or-later"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
packages = [{include = "neurochip"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
nmtk_contracts = {path = "../nmtk_contracts"}
fastapi = {extras = ["standard"], version = "*"}
uvicorn = "*"
pydantic = "*"
sqlalchemy = "^2.0"
python-multipart = "^0.0.22"
jinja2 = "^3.1.6"
pyserial = "^3.5"
slowapi = "^0.1.9"
pynq = {version = ">=2.7", optional = true}
akida = {version = ">=2.0.0", optional = true}
tensorflow = {version = "==2.19.*", optional = true}
cnn2snn = {version = "==2.19.1", optional = true}
quantizeml = {version = "==1.2.4", optional = true}
onnx = {version = ">=1.17,<2", optional = true}
"akida-models" = {version = "==1.13.1", optional = true, python = "<3.14"}
# lava-nc (latest 0.10.0) requires Python >=3.10,<3.11, which is incompatible
# with this project's >=3.11 floor, so the `lava` extra is impossible here.
# The Lava runtime lives instead in workers/lava_backend/requirements.txt,
# installed on Python 3.10 by Dockerfile.lava.
sinabs = {version = "*", optional = true}
samna = {version = "*", optional = true}

[tool.poetry.extras]
pynq = ["pynq"]
akida = ["akida"]
"akida-metatf" = ["akida", "tensorflow", "cnn2snn", "quantizeml", "onnx", "akida-models"]
synsense = ["sinabs", "samna"]

[tool.poetry.scripts]
neurochip-pynq-agent = "neurochip.app.pynq_agent:main"

[tool.poetry.group.dev.dependencies]
pytest = "*"
syrupy = "*"
httpx = "*"
pytest-cov = "^7.0.0"
ruff = "*"
mypy = "*"
hypothesis = "^6.0.0"
coverage = "^7.13.5"
numpy = ">=1.24"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "G", "UP"]
ignore = ["E501",
    "D101",
    "D103",
    "ANN101",
    "ANN401",
    "E402",
    "F841",
    "D417",
    "D205",
    "D102",
    "D415",
]

[tool.ruff.lint.isort]
known-first-party = ["neurochip"]

[tool.pytest.ini_options]
# Verified local command:
# `poetry run pytest neurochip/tests -q`
testpaths = ["neurochip/tests"]
pythonpath = ["."]
markers = [
    "mock_only: non-gating tests that use mocks only",
    "hardware: requires real hardware (skipped in CI)",
]

[tool.mypy]
warn_unused_ignores = false
disallow_untyped_decorators = false
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
