name: CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'neurosim/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'neurosim/pyproject.toml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'neurosim/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'neurosim/pyproject.toml'

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
          if exist "C:\Program Files\Git\bin\git.exe" echo C:\Program Files\Git\bin>>%GITHUB_PATH%
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" echo C:\Program Files (x86)\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4
      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Install Python via Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 || true
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Install linting tools
        run: pip install ruff black isort
      - name: Run Ruff Check
        run: ruff check --config neurosim/pyproject.toml .
      - name: Run Ruff Format Check
        run: ruff format --check --config neurosim/pyproject.toml .
      - name: Run Black Check
        run: black --check --config neurosim/pyproject.toml .
      - name: Run isort Check
        run: isort --check-only --settings-path neurosim/pyproject.toml .

  type-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
          if exist "C:\Program Files\Git\bin\git.exe" echo C:\Program Files\Git\bin>>%GITHUB_PATH%
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" echo C:\Program Files (x86)\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4
      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Install Python via Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 || true
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Install dependencies
        run: |
          pip install mypy fastapi pydantic types-requests
          pip install -e neurosim/
      - name: Run MyPy
        run: mypy --config-file neurosim/pyproject.toml .

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
          if exist "C:\Program Files\Git\bin\git.exe" echo C:\Program Files\Git\bin>>%GITHUB_PATH%
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" echo C:\Program Files (x86)\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4
      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Install Python via Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 || true
          echo "$(brew --prefix python@3.12)/bin" >> "$GITHUB_PATH"

      - name: Set up Python
        if: runner.os != 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "neurosim/[test,dev]"
      - name: Run tests with coverage
        run: |
          PYTHONPATH=. python -m pytest --cov=neurosim/app --junitxml=pytest.xml neurosim/tests/ --ignore=neurosim/tests/test_sweep_smoke_e2e.py -p no:nengo
      - name: Check coverage
        run: |
          python -m coverage report --fail-under=60
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest.xml
            server.log

  test-frontend:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd\git.exe" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
          if exist "C:\Program Files\Git\bin\git.exe" echo C:\Program Files\Git\bin>>%GITHUB_PATH%
          if exist "C:\Program Files (x86)\Git\cmd\git.exe" echo C:\Program Files (x86)\Git\cmd>>%GITHUB_PATH%

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze
        run: |
          cd frontend
          flutter analyze

      - name: Run tests
        run: |
          cd frontend
          flutter test

  e2e:
    needs:
      - test
      - test-frontend
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "neurosim/[test,dev]"

      - name: Install frontend dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Start Neurosim backend
        run: |
          python -m uvicorn neurosim.app.main:app --host 127.0.0.1 --port 8001 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend readiness
        run: |
          python - <<'PY'
          import sys
          import time

          import httpx

          deadline = time.time() + 30
          url = "http://127.0.0.1:8001/api/neurosim/components"

          while time.time() < deadline:
              try:
                  response = httpx.get(url, timeout=2.0)
              except Exception:
                  time.sleep(0.5)
                  continue

              if response.status_code == 200:
                  sys.exit(0)

              time.sleep(0.5)

          sys.exit("Neurosim backend did not become ready in time.")
          PY

      - name: Run backend end-to-end tests
        run: |
          python -m pytest \
            neurosim/tests/test_integration.py \
            neurosim/tests/test_simulation_integration.py \
            neurosim/tests/test_sweep_smoke_e2e.py \
            -p no:nengo

      - name: Run frontend integration test
        run: |
          cd frontend
          flutter test integration_test/app_pipeline_test.dart --dart-define=API_BASE_URL=http://127.0.0.1:8001

      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neurosim-e2e-logs
          path: |
            backend.log
            server.log

      - name: Stop Neurosim backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
