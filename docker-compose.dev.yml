      - ./neurocnl/neurocnl:/app/neurocnl
      - ./neurocnl/backend:/app/backend
    environment:
      - DEBUG=1

  neurocnl-physics:
    volumes:
      - ./neurocnl/neurocnl:/app/neurocnl
      - ./neurocnl/backend:/app/backend
    environment:
      - DEBUG=1

  neurosim:
    volumes:
      - ./Neurosim/neurosim:/app/neurosim
