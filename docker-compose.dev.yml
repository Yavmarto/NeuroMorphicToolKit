    environment:
      - DEBUG=1

  neurobench:
    volumes:
      - ./Neurobench/neurobench:/app/neurobench
    environment:
      - DEBUG=1

  neurosense:
    volumes:
      - ./Neurosense/neurosense:/app/neurosense
    environment:
      - DEBUG=1

  neurohub:
    volumes:
      - ./Neurohub/neurohub:/app/neurohub
    environment:
      - DEBUG=1
