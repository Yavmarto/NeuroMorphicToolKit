# Reference for the HTTP→HTTPS redirector block that
# `scripts/webtop-mkcert-startup.sh` splices into
# `/etc/nginx/sites-enabled/default` at container start, replacing the
# upstream `linuxserver/webtop` HTTP server block (port 3000, plain) that
# serves the Selkies web frontend. The SSL server block (port 3001) is
# preserved as-is — the upstream block already references
# `/config/ssl/cert.pem` and `/config/ssl/cert.key`, which is what mkcert
# writes to.
#
# The script bakes the WEBTOP_HTTPS_PORT env var in place of the `:3031`
# below so the redirect lands on the *public* host port (default 3031),
# not the container-internal :3001.
#
# Why a splice (and not a full-file rewrite): the upstream webtop default
# site contains TWO server blocks — the HTTP one and the SSL one. A
# full-file overwrite would delete the SSL block, leaving the browser's
# HTTPS request to be refused. A previous version of the script did this
# and broke HTTPS. The splice keeps the SSL block untouched.
#
# The browser's Host header is "<host>:<port>" (e.g. "198.51.100.10:3030"),
# and we need to redirect to "<host>:<WEBTOP_HTTPS_PORT>". Strip the
# trailing port with a regex set, then append the HTTPS port.

server {
    listen      3000 default_server;
    listen [::]:3000 default_server;

    set $redirect_host $http_host;
    if ($redirect_host ~ "^(.+):[0-9]+$") {
        set $redirect_host $1;
    }
    return 301 https://$redirect_host:3031$request_uri;
}
