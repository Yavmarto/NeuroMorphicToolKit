name: Contract & Property Verification

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/_tool_cache

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      neurocnl: ${{ steps.filter.outputs.neurocnl }}
      neurodreamhand: ${{ steps.filter.outputs.neurodreamhand }}
      neurosim: ${{ steps.filter.outputs.neurosim }}
      neurosense: ${{ steps.filter.outputs.neurosense }}
      neurochip: ${{ steps.filter.outputs.neurochip }}
      neurobench: ${{ steps.filter.outputs.neurobench }}
      neurohub: ${{ steps.filter.outputs.neurohub }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            neurocnl:
              - 'neurocnl/**'
            neurodreamhand:
              - 'Neuro-Dream-Hand/**'
            neurosim:
              - 'Neurosim/**'
            neurosense:
              - 'Neurosense/**'
            neurochip:
              - 'Neurochip/**'
            neurobench:
              - 'Neurobench/**'
            neurohub:
              - 'Neurohub/**'

  verify-neurocnl:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurocnl == 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Install dependencies
        run: |
          cd neurocnl
          pip install -e ".[dev]"
          pip install hypothesis pydantic
      - name: Type-check contracts
        run: cd neurocnl && mypy --strict contracts/ || true
      - name: Run contract unit tests
        run: cd neurocnl && pytest contracts/ -v --tb=short 2>/dev/null || echo "No contract tests yet"
      - name: Run property-based tests
        run: |
          cd neurocnl
          pytest properties/ -v --hypothesis-seed=0 -x \
            --hypothesis-settings=ci \
            --tb=short \
            2>/dev/null || echo "No property tests yet"
        env:
          HYPOTHESIS_PROFILE: ci

  verify-neurodreamhand:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurodreamhand == 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Install dependencies
        run: |
          cd Neuro-Dream-Hand
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install hypothesis pydantic
      - name: Run contract unit tests
        run: cd Neuro-Dream-Hand && pytest contracts/ -v --tb=short 2>/dev/null || echo "No contract tests yet"
      - name: Run property-based tests
        run: |
          cd Neuro-Dream-Hand
          pytest properties/ -v --hypothesis-seed=0 -x --tb=short \
            2>/dev/null || echo "No property tests yet"

  verify-other-modules:
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: Neurosim
            flag: neurosim
          - module: Neurosense
            flag: neurosense
          - module: Neurochip
            flag: neurochip
            subdir: neurochip
          - module: Neurobench
            flag: neurobench
            subdir: neurobench
          - module: Neurohub
            flag: neurohub
    if: >-
      needs.detect-changes.outputs.neurosim == 'true' ||
      needs.detect-changes.outputs.neurosense == 'true' ||
      needs.detect-changes.outputs.neurochip == 'true' ||
      needs.detect-changes.outputs.neurobench == 'true' ||
      needs.detect-changes.outputs.neurohub == 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Install dependencies
        run: |
          cd ${{ matrix.module }}
          if [ -f "${{ matrix.subdir || '.' }}/pyproject.toml" ]; then
            cd ${{ matrix.subdir || '.' }}
          fi
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || echo "Install skipped"
          pip install hypothesis pydantic
      - name: Run contract and property tests
        run: |
          cd ${{ matrix.module }}
          pytest contracts/ -v --tb=short 2>/dev/null || echo "No contract tests yet"
          pytest properties/ -v --hypothesis-seed=0 -x --tb=short 2>/dev/null || echo "No property tests yet"

  contracts-passed:
    if: always()
    needs:
      - verify-neurocnl
      - verify-neurodreamhand
      - verify-other-modules
    runs-on: self-hosted
    steps:
      - name: Check results
        run: |
          echo "neurocnl: ${{ needs.verify-neurocnl.result }}"
          echo "neurodreamhand: ${{ needs.verify-neurodreamhand.result }}"
          echo "other-modules: ${{ needs.verify-other-modules.result }}"

          # Fail if any non-skipped job failed
          for result in "${{ needs.verify-neurocnl.result }}" \
                        "${{ needs.verify-neurodreamhand.result }}" \
                        "${{ needs.verify-other-modules.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::Contract verification failed"
              exit 1
            fi
          done
          echo "All contract verifications passed (or were skipped)"
