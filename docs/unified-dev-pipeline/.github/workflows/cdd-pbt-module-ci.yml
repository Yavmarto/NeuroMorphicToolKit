# CDD-PBT Module CI — Reusable Workflow Template
#
# From GPT-5.4, adapted for unified pipeline paths.
# Called by per-module CI workflows to run setup → baseline → migration.
#
name: CDD-PBT Module CI

on:
  workflow_call:
    inputs:
      module_config:
        description: "Relative path to the module's module.json"
        required: true
        type: string
      python_version:
        description: "Python version to use"
        required: true
        type: string

env:
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/_tool_cache

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

      - name: Install shared runner tools
        run: python -m pip install --upgrade pip

      - name: Run baseline and migration validation
        run: |
          python docs/unified-dev-pipeline/scripts/run_contract_ci.py \
            --config "${{ inputs.module_config }}" \
            --phase all
