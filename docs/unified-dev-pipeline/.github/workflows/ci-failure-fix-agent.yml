# Auto-Fix CI Failures — Unified Pipeline
#
# From GPT-5.4. When CI fails, downloads structured logs and invokes
# Jules with enough context to fix the root cause.
#
name: Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ["Contract & Property Verification", "CDD-PBT Module CI"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  fix-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Download logs URL
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            core.setOutput("logs_url", response.url);

      - name: Invoke Jules to fix failure
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            The workflow run failed and needs a focused fix.

            Workflow: ${{ github.event.workflow_run.name }}
            Run URL: ${{ github.event.workflow_run.html_url }}
            Logs URL: ${{ steps.logs.outputs.logs_url }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Commit: ${{ github.event.workflow_run.head_sha }}

            Requirements:
            1. Read the failed jobs and logs.
            2. Fix only the root cause.
            3. Do not weaken tests, contracts, or property checks.
            4. Read the relevant AGENTS.md and GUARDRAILS.md before making changes.
            5. Open a PR from a jules/* branch so auto-merge can attach once checks pass.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          include_last_commit: true
