name: CDD-PBT Module CI

on:
  workflow_call:
    inputs:
      module_config:
        required: true
        type: string
      python_version:
        required: true
        type: string

env:
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/_tool_cache

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

      - name: Install shared runner tools
        run: |
          python -m pip install --upgrade pip

      - name: Run baseline and migration validation
        run: |
          python Research-Spec-driven-development/gpt5.4-dev-pipeline/scripts/run_contract_ci.py \
            --config "${{ inputs.module_config }}" \
            --phase all