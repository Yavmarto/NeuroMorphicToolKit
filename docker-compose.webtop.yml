services:
  nmtk-webtop:
    build:
      context: .
      dockerfile: Dockerfile.webtop
    ports:
      - "${WEBTOP_PORT:-3030}:3000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBTOP_TITLE=NMTK NeuroMorphic Toolkit
    volumes:
      - nmtk_webtop_config:/config
    restart: unless-stopped
    shm_size: 2gb

volumes:
  nmtk_webtop_config:
