name: Build Feature

on:
  issues:
    types: [labeled]

jobs:
  build-feature:
    if: ${{ github.event.label.name == 'feature' || github.event.label.name == 'agent' }}
    uses: ./.github/workflows/reusable-feature-builder.yml
    with:
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      sender_login: ${{ github.event.sender.login }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
