name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  python-audit:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitPath = "C:\Program Files\Git\cmd"
          if (Test-Path $gitPath) {
            "$gitPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/checkout@v4
      - name: Configure tool cache
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pip-audit
        run: |
          pip install pip-audit
          # Audit root and submodules
          pip-audit || true
          find . -name "requirements.txt" -exec pip-audit -r {} \; || true

  owasp-dependency-check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitPath = "C:\Program Files\Git\cmd"
          if (Test-Path $gitPath) {
            "$gitPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/checkout@v4
      - name: Dependency Check
        uses: dependency-check/DependencyCheck_Action@main
        with:
          project: 'NMTK'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --enableRetired
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
