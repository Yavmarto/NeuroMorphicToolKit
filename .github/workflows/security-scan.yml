name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 0 * * 1'

env:
  AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/_tool_cache

jobs:
  python-audit:
    runs-on: self-hosted
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitPath = "C:\Program Files\Git\cmd"
          if (Test-Path $gitPath) {
            "$gitPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Run pip-audit
        run: |
          pip install pip-audit
          # Audit root and submodules
          pip-audit || true
          find . -name "requirements.txt" -exec pip-audit -r {} \; || true

  owasp-dependency-check:
    runs-on: self-hosted
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitPath = "C:\Program Files\Git\cmd"
          if (Test-Path $gitPath) {
            "$gitPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/checkout@v4
      - name: Dependency Check
        uses: dependency-check/DependencyCheck_Action@main
        with:
          project: 'NMTK'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --enableRetired
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
