name: NMTK Launcher CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'nmtk/neuro_toolkit/**'
      - 'nmtk_ui_core/**'
      - '.github/workflows/nmtk-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'nmtk/neuro_toolkit/**'
      - 'nmtk_ui_core/**'
      - '.github/workflows/nmtk-ci.yml'

jobs:
  test:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        flutter_channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          cache: true

      - name: Install dependencies (nmtk_ui_core)
        run: |
          if [ -d "nmtk_ui_core" ]; then
            cd nmtk_ui_core
            flutter pub get
          fi

      - name: Install dependencies (neuro_toolkit)
        run: |
          if [ -d "nmtk/neuro_toolkit" ]; then
            cd nmtk/neuro_toolkit
            flutter pub get
          fi

      - name: Format check
        run: |
          PATHS=""
          [ -d "nmtk_ui_core" ] && PATHS="$PATHS nmtk_ui_core"
          [ -d "nmtk/neuro_toolkit" ] && PATHS="$PATHS nmtk/neuro_toolkit"
          if [ -n "$PATHS" ]; then
            dart format $PATHS
          fi

      - name: Analyze (nmtk_ui_core)
        run: |
          if [ -d "nmtk_ui_core" ]; then
            cd nmtk_ui_core
            flutter analyze
          fi

      - name: Analyze (neuro_toolkit)
        run: |
          if [ -d "nmtk/neuro_toolkit" ]; then
            cd nmtk/neuro_toolkit
            flutter analyze
          fi

      - name: Run tests (nmtk_ui_core)
        run: |
          if [ -d "nmtk_ui_core" ]; then
            cd nmtk_ui_core
            flutter test
          else
            echo "Directory nmtk_ui_core not found"
          fi

      - name: Run tests (neuro_toolkit)
        run: |
          if [ -d "nmtk/neuro_toolkit" ]; then
            cd nmtk/neuro_toolkit
            flutter test
          else
            echo "Directory nmtk/neuro_toolkit not found"
          fi

      - name: Run Integration tests (neuro_toolkit)
        run: |
          if [ -d "nmtk/neuro_toolkit" ] && [ -d "nmtk_ui_core" ]; then
            cd nmtk/neuro_toolkit
            flutter test integration_test/app_test.dart
          else
            echo "Directories for neuro_toolkit integration test not fully present"
          fi

      - name: Run E2E Launcher tests (neuro_toolkit)
        env:
          FORCE_E2E: true
        run: |
          if [ -d "nmtk/neuro_toolkit" ]; then
            cd nmtk/neuro_toolkit
            flutter test test/launcher_e2e_test.dart
          else
            echo "Directory nmtk/neuro_toolkit not found"
          fi


  build-linux:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev libsecret-1-dev libsystemd-dev libwebkit2gtk-4.1-dev llvm-18-dev lld-18 clang cmake ninja-build pkg-config
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build Linux
        run: |
          if [ -d "nmtk/neuro_toolkit" ]; then
            cd nmtk/neuro_toolkit
            flutter pub get
            flutter build linux
          else
            echo "Directory nmtk/neuro_toolkit not found"
          fi
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmtk-launcher-linux
          path: nmtk/neuro_toolkit/build/linux/x64/release/bundle/

  build-macos:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Build macOS
        run: |
          if [ -d "nmtk/neuro_toolkit" ]; then
            cd nmtk/neuro_toolkit
            flutter pub get
            flutter build macos
          else
            echo "Directory nmtk/neuro_toolkit not found"
          fi
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmtk-launcher-macos
          path: nmtk/neuro_toolkit/build/macos/Build/Products/Release/
