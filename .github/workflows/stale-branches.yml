name: Stale Branch Cleanup

# Deletes remote branches that have been merged and are older than 7 days.
# Only targets jules/* and auto/* branches. Runs weekly.

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 3 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and delete stale merged branches
        run: |
          echo "## Stale Branch Cleanup" >> "$GITHUB_STEP_SUMMARY"
          DELETED=0

          # Get merged branches (excluding main, dev, HEAD)
          for branch in $(git branch -r --merged origin/dev | grep -E 'origin/(jules/|auto/)' | sed 's|origin/||' | xargs); do
            # Check if branch is older than 7 days
            LAST_COMMIT_DATE=$(git log -1 --format="%ci" "origin/$branch" 2>/dev/null || continue)
            LAST_COMMIT_TS=$(date -d "$LAST_COMMIT_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%d %H:%M:%S %z" "$LAST_COMMIT_DATE" +%s 2>/dev/null || continue)
            CUTOFF_TS=$(date -d "7 days ago" +%s 2>/dev/null || date -v-7d +%s 2>/dev/null)

            if [ "$LAST_COMMIT_TS" -lt "$CUTOFF_TS" ]; then
              echo "- Deleting \`$branch\` (last commit: $LAST_COMMIT_DATE)" >> "$GITHUB_STEP_SUMMARY"
              git push origin --delete "$branch" 2>/dev/null || echo "  ⚠ Failed to delete $branch"
              DELETED=$((DELETED + 1))
            fi
          done

          if [ "$DELETED" -eq 0 ]; then
            echo "No stale branches found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Deleted $DELETED stale branch(es)**" >> "$GITHUB_STEP_SUMMARY"
          fi
