name: Reusable Unused Code Remover

on:
  workflow_call:
    secrets:
      JULES_API_KEY:
        required: true

jobs:
  sdd-context:
    uses: ./.github/workflows/sdd-context-bridge.yml

  remove-unused:
    needs: sdd-context
    runs-on: ubuntu-latest
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Invoke Jules for Unused Code Removal
        uses: google-labs-code/jules-action@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Remove unused code
            ════════════════════════════════════════

            Remove code that is completely unused. Safety is the top priority —
            it is completely fine to make no changes if you are uncertain.

            ## Approach

            - For Python modules: install and run `ruff check --select F401,F811`
              to find unused imports, then use `vulture` or `grep` to find dead functions/classes
            - For Dart/Flutter: use `dart analyze` to surface unused symbols
            - Use `grep -r` to confirm a symbol truly has no callers before deleting it
            - Check for dynamic references (e.g. `getattr`, `importlib`, reflection) that
              static analysis cannot see — leave those alone

            ## Constraints

            - Do NOT change or remove any public API (exported functions, REST endpoints, CLI commands)
            - All existing tests must pass after your changes
            - If a symbol looks unused but has a comment like "# reserved for future use", leave it
            - Prefer one focused PR per language/layer rather than one giant PR
