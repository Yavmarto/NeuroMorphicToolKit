name: Auto-Merge Jules PRs

on:
  pull_request:
    types: [opened, reopened]

jobs:
  auto-merge:
    if: ${{ startsWith(github.head_ref, 'jules/') }}
    uses: ./.github/workflows/reusable-auto-merge.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_ref: ${{ github.head_ref }}
