name: Reusable Status Audit & Readiness Check

on:
  workflow_call:
    inputs:
      trigger_label:
        description: 'Label that triggered this workflow'
        required: false
        type: string
        default: 'status-audit'
      trusted_users:
        description: 'JSON array of trusted GitHub usernames'
        required: false
        type: string
        default: '["Yavmarto"]'
      agent_name:
        description: 'The name of the agent executing the audit'
        required: false
        type: string
        default: 'Jules'
      issue_number:
        description: 'GitHub Issue Number to report back to'
        required: false
        type: string
      target_directory:
        description: 'Directory to audit (e.g., specific submodule or . for root)'
        required: false
        type: string
        default: '.'
    secrets:
      JULES_API_KEY:
        required: true
      JULES_API_KEY_F:
        required: false

jobs:
  sdd-context:
    uses: Completed-Spoon-6/NeuroMorphicToolKit/.github/workflows/sdd-context-bridge.yml@dev

  status-audit:
    needs: sdd-context
    if: ${{ contains(fromJSON(inputs.trusted_users), github.actor) }}
    runs-on: self-hosted
    concurrency:
      group: agent-audit-${{ github.repository }}-${{ inputs.target_directory }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Prepare Audit Prompt
        id: prep
        run: |
          PROMPT_FILE="docs/instructions/status-audit-prompt.md"
          # Support running in a submodule by checking if the central file exists locally
          if [ -f "$PROMPT_FILE" ]; then
            PROMPT=$(cat "$PROMPT_FILE")
          else
            # Fetch from the root repository directly via raw github API (falling back to main/dev branch)
            PROMPT=$(curl -sL "https://raw.githubusercontent.com/${{ github.repository_owner }}/NeuroMorphicToolKit/main/$PROMPT_FILE" || curl -sL "https://raw.githubusercontent.com/${{ github.repository_owner }}/NeuroMorphicToolKit/dev/$PROMPT_FILE")
          fi

          # Prepare injected variables for the agent prompt
          CURRENT_DATE=$(date +"%d-%b-%Y")
          AGENT_NAME="${{ inputs.agent_name }}"
          TARGET_DIR="${{ inputs.target_directory }}"

          PROMPT="${PROMPT//\{AUDIT_DATE\}/"$CURRENT_DATE"}"
          PROMPT="${PROMPT//\{AGENT_NAME\}/"$AGENT_NAME"}"

          PROMPT="${PROMPT}

          --- EXECUTION CONTEXT ---
          TARGET DIRECTORY FOR THIS AUDIT: '$TARGET_DIR'
          Please constrain your analysis and issue-checking ONLY to the scope of '$TARGET_DIR'."

          # Pass to the next step
          {
            echo "prompt<<EOF"
            echo "$PROMPT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Invoke Agent for Status Audit (Primary Key)
        id: agent-primary
        continue-on-error: true
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            ${{ steps.prep.outputs.prompt }}

            --- PROJECT CONTEXT ---
            ${{ needs.sdd-context.outputs.context }}

            --- REQUEST ---
            Perform the codebase audit and generate the objective status report Markdown file as instructed.
            If an issue number is provided: Fixes #${{ inputs.issue_number }}

      - name: Invoke Agent for Status Audit (Fallback Key)
        id: agent-fallback
        if: steps.agent-primary.outcome == 'failure'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY_F }}
          prompt: |
            ${{ steps.prep.outputs.prompt }}

            --- PROJECT CONTEXT ---
            ${{ needs.sdd-context.outputs.context }}

            --- REQUEST ---
            Perform the codebase audit and generate the objective status report Markdown file as instructed.
            If an issue number is provided: Fixes #${{ inputs.issue_number }}
