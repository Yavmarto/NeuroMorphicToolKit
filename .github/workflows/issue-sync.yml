# Sync CDD-PBT Migration Issues — Unified Pipeline
#
# From GPT-5.4, adapted for unified pipeline paths.
# Generates previews and publishes issues to GitHub.
#
name: Sync CDD-PBT Migration Issues

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Optional module folder name (e.g., neurocnl, neurosim)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  sync-issues:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4

      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

      - name: Generate previews
        run: |
          if [ -n "${{ github.event.inputs.module }}" ]; then
            python docs/unified-dev-pipeline/scripts/generate_issue_previews.py \
              --module "${{ github.event.inputs.module }}"
          else
            python docs/unified-dev-pipeline/scripts/generate_issue_previews.py
          fi

      - name: Publish issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.module }}" ]; then
            python docs/unified-dev-pipeline/scripts/publish_github_issues.py \
              --module "${{ github.event.inputs.module }}" --execute
          else
            python docs/unified-dev-pipeline/scripts/publish_github_issues.py --execute
          fi
