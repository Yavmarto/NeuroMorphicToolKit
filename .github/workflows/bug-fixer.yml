name: Auto-Fix Bugs

on:
  issues:
    types: [labeled]

jobs:
  fix-bug:
    if: ${{ github.event.label.name == 'bug' || github.event.label.name == 'bug1' || github.event.label.name == 'bug2' }}
    uses: ./.github/workflows/reusable-bug-fixer.yml
    with:
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      sender_login: ${{ github.event.sender.login }}
      trigger_label: ${{ github.event.label.name }}
      issue_number: ${{ github.event.issue.number }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      JULES_API_KEY_F: ${{ secrets.JULES_API_KEY_F }}
