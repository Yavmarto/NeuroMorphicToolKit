name: Reusable Unblocked Issues Worker

on:
  workflow_call:
    inputs:
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      issue_author:
        required: true
        type: string
      trusted_users:
        description: 'JSON array of trusted GitHub usernames'
        required: false
        type: string
        default: '["your-github-username"]'
    secrets:
      JULES_API_KEY:
        required: true
      JULES_API_KEY_F:
        required: false

jobs:
  sdd-context:
    uses: Completed-Spoon-6/NeuroMorphicToolKit/.github/workflows/sdd-context-bridge.yml@dev

  implement:
    needs: sdd-context
    if: ${{ contains(fromJSON(inputs.trusted_users), inputs.issue_author) }}
    runs-on: self-hosted
    concurrency:
      group: agent-work
      cancel-in-progress: false
    steps:
      - name: Invoke Jules on Unblocked Issue (primary key)
        id: jules-primary
        continue-on-error: true
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Implement unblocked issue
            ════════════════════════════════════════

            A previously blocked issue is now unblocked and ready for implementation:

            ## ${{ inputs.issue_title }}

            ${{ inputs.issue_body }}

            This issue was waiting on a dependency that has just been resolved.
            Please implement it now, following the project's coding standards.
            Add tests and open a pull request.

      - name: Invoke Jules on Unblocked Issue (fallback key)
        id: jules-fallback
        if: steps.jules-primary.outcome == 'failure'
        continue-on-error: true
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY_F }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Implement unblocked issue
            ════════════════════════════════════════

            A previously blocked issue is now unblocked and ready for implementation:

            ## ${{ inputs.issue_title }}

            ${{ inputs.issue_body }}

            This issue was waiting on a dependency that has just been resolved.
            Please implement it now, following the project's coding standards.
            Add tests and open a pull request.

      - name: Invoke Jules on Unblocked Issue (retry primary key)
        if: steps.jules-primary.outcome == 'failure' && steps.jules-fallback.outcome == 'failure'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Implement unblocked issue
            ════════════════════════════════════════

            A previously blocked issue is now unblocked and ready for implementation:

            ## ${{ inputs.issue_title }}

            ${{ inputs.issue_body }}

            This issue was waiting on a dependency that has just been resolved.
            Please implement it now, following the project's coding standards.
            Add tests and open a pull request.
