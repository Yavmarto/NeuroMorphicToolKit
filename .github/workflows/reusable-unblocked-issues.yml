name: Reusable Unblocked Issues Worker

on:
  workflow_call:
    inputs:
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      issue_author:
        required: true
        type: string
      trusted_users:
        description: 'JSON array of trusted GitHub usernames'
        required: false
        type: string
        default: '["your-github-username"]'
    secrets:
      JULES_API_KEY:
        required: true
      JULES_API_KEY_F:
        required: false

jobs:
  sdd-context:
    uses: ./.github/workflows/sdd-context-bridge.yml

  implement:
    needs: sdd-context
    if: ${{ contains(fromJSON(inputs.trusted_users), inputs.issue_author) }}
    runs-on: self-hosted
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Select API key (round-robin)
        id: select-key
        run: |
          if [ $(( ${{ github.run_number }} % 2 )) -eq 0 ]; then
            echo "::add-mask::${KEY_A}"
            echo "selected_key=${KEY_A}" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::${KEY_B}"
            echo "selected_key=${KEY_B}" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEY_A: ${{ secrets.JULES_API_KEY }}
          KEY_B: ${{ secrets.JULES_API_KEY_F || secrets.JULES_API_KEY }}

      - name: Invoke Jules on Unblocked Issue
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ steps.select-key.outputs.selected_key }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Implement unblocked issue
            ════════════════════════════════════════

            A previously blocked issue is now unblocked and ready for implementation:

            ## ${{ inputs.issue_title }}

            ${{ inputs.issue_body }}

            This issue was waiting on a dependency that has just been resolved.
            Please implement it now, following the project's coding standards.
            Add tests and open a pull request.
