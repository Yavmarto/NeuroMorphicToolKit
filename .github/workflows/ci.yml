      - name: Python diagnostics
        run: |
          python --version
          python -m pip --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            where python || true
            where pytest || true
          else
            which python || true
            which pytest || true
          fi
      - name: Install dependencies
        run: |
          if [ -d "Neurohub/neurohub" ] && [ -f "Neurohub/pyproject.toml" ]; then
            python -m pip install -e "./Neurohub[dev]"
          else
            echo "Submodule missing, skipping"
          fi
      - name: Lint with ruff
        run: |
          if [ -d "Neurohub/neurohub" ] && [ -f "Neurohub/pyproject.toml" ]; then
            cd Neurohub
            python -m ruff check .
            python -m ruff format --check .
          fi
      - name: Type check with mypy
        run: |
