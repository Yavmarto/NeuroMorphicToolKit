            where python || true
            where pytest || true
          else
            which python || true
            which pytest || true
          fi
      - name: Install poetry
        run: |
          if [ -d "Neurobench/neurobench" ] && [ -f "Neurobench/neurobench/pyproject.toml" ]; then
            python -m pip install poetry
          fi
      - name: Install dependencies
        run: |
          if [ -d "Neurobench/neurobench" ] && [ -f "Neurobench/neurobench/pyproject.toml" ]; then
            cd Neurobench/neurobench && poetry install
          fi
      - name: Lint with ruff
        run: |
          if [ -d "Neurobench/neurobench" ] && [ -f "Neurobench/neurobench/pyproject.toml" ]; then
            cd Neurobench/neurobench
            poetry run ruff check .
            poetry run ruff format --check .
          fi
      - name: Type check with mypy
        run: |
          if [ -d "Neurobench/neurobench" ] && [ -f "Neurobench/neurobench/pyproject.toml" ]; then
            cd Neurobench/neurobench
            poetry run mypy .
          fi
      - name: Run tests
        run: |
          if [ -d "Neurobench/neurobench" ] && [ -f "Neurobench/neurobench/pyproject.toml" ]; then
            cd Neurobench/neurobench
            poetry run pytest --tb=short --hypothesis-show-statistics
