          fi

  test-neurocnl-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurocnl == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Update required submodules
        run: |
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${{ secrets.GITHUB_TOKEN }}" submodule update --init neurocnl || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Python diagnostics
        run: |
          python --version
          python -m pip --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            where python || true
            where pytest || true
          else
            which python || true
            which pytest || true
          fi
      - name: Install core package
        run: |
          if [ -d "neurocnl" ] && [ -f "neurocnl/pyproject.toml" ]; then
            python -m pip install -e ./neurocnl
            python -m pip install pytest httpx ruff mypy
          else
            echo "neurocnl missing, skipping install"
          fi
      - name: Lint with ruff
        run: |
          if [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            python -m ruff check .
            python -m ruff format --check .
          else
            echo "neurocnl missing, skipping lint"
          fi
      - name: Type check with mypy
        run: |
          if [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            python -m mypy neurocnl
          else
            echo "neurocnl missing, skipping type check"
          fi
      - name: Install backend deps
        run: |
          if [ -f "neurocnl/backend/requirements.txt" ]; then
            cd neurocnl/backend
            python -m pip install -r requirements.txt
          else
            echo "neurocnl/backend missing, skipping backend deps"
          fi
      - name: Run core tests
        run: |
          if [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            python -m pytest neurocnl/ -v --tb=short
          else
            echo "neurocnl missing, skipping core tests"
          fi
      - name: Run backend tests
        run: |
          if [ -f "neurocnl/backend/requirements.txt" ]; then
            cd neurocnl/backend
            PYTHONPATH=. python -m pytest tests --tb=short
          else
            echo "neurocnl/backend missing, skipping backend tests"
          fi

  test-neurobench:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurobench == 'true'
    strategy:
