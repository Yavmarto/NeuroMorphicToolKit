        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Update submodules safely
