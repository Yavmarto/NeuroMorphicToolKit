        with:
          submodules: false
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false
      - name: Install dependencies
        run: |
          flutter pub get --directory nmtk_ui_core
      - name: Analyze
        run: |
          flutter analyze --directory nmtk_ui_core
      - name: Run tests
        run: |
          cd nmtk_ui_core && flutter test --coverage

