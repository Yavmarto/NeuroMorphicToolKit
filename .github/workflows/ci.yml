name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      neurochip: ${{ steps.filter.outputs.neurochip }}
      neurochip_frontend: ${{ steps.filter.outputs.neurochip_frontend }}
      neurosense: ${{ steps.filter.outputs.neurosense }}
      neurosense_frontend: ${{ steps.filter.outputs.neurosense_frontend }}
      neurohub: ${{ steps.filter.outputs.neurohub }}
      neurohub_frontend: ${{ steps.filter.outputs.neurohub_frontend }}
      neurodreamhand: ${{ steps.filter.outputs.neurodreamhand }}
      neurocnl: ${{ steps.filter.outputs.neurocnl }}
      neurocnl_frontend: ${{ steps.filter.outputs.neurocnl_frontend }}
      neurobench: ${{ steps.filter.outputs.neurobench }}
      neurobench_frontend: ${{ steps.filter.outputs.neurobench_frontend }}
      neurotoolkit: ${{ steps.filter.outputs.neurotoolkit }}
      macos_installer: ${{ steps.filter.outputs.macos_installer }}
      windows_installer: ${{ steps.filter.outputs.windows_installer }}
      nmtk_ui_core: ${{ steps.filter.outputs.nmtk_ui_core }}
      suite_api: ${{ steps.filter.outputs.suite_api }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Update submodules safely
        run: git submodule update --init || true
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            neurochip:
              - 'Neurochip/neurochip/**'
            neurochip_frontend:
              - 'Neurochip/frontend/**'
              - 'nmtk_ui_core/**'
            neurosense:
              - 'Neurosense/**'
              - '!Neurosense/frontend/**'
            neurosense_frontend:
              - 'Neurosense/frontend/**'
              - 'nmtk_ui_core/**'
            neurohub:
              - 'Neurohub/**'
              - '!Neurohub/frontend/**'
            neurohub_frontend:
              - 'Neurohub/frontend/**'
              - 'nmtk_ui_core/**'
            neurocnl:
              - 'neurocnl/**'
              - '!neurocnl/frontend/**'
            neurocnl_frontend:
              - 'neurocnl/frontend/**'
              - 'nmtk_ui_core/**'
            neurobench:
              - 'Neurobench/neurobench/**'
            neurobench_frontend:
              - 'Neurobench/frontend/**'
              - 'nmtk_ui_core/**'
            neurotoolkit:
              - 'nmtk/neuro_toolkit/**'
              - 'nmtk_ui_core/**'
            macos_installer:
              - 'nmtk/installer/macos/**'
              - 'tests/test_macos_installer_signing.py'
              - '.github/workflows/release-desktop.yml'
            windows_installer:
              - 'nmtk/installer/windows/**'
              - 'tests/test_windows_installer_signing.py'
              - '.github/workflows/release-desktop.yml'
            nmtk_ui_core:
              - 'nmtk_ui_core/**'
            suite_api:
              - 'suite_api/**'
              - 'workers/**'
              - 'scripts/ci/suiteapi.sh'
              - 'tests/integration/**'

  test-suite-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.suite_api == 'true'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run canonical Suite API checks
        run: bash scripts/ci/suiteapi.sh

  pre-commit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python diagnostics
        run: |
          python --version
          python -m pip --version
          which python || true
          which pytest || true
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files

  test-neurochip:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurochip == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Update submodule
        run: git submodule update --init Neurochip || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Python diagnostics
        run: |
          python --version
          python -m pip --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            where python || true
            where pytest || true
          else
            which python || true
            which pytest || true
          fi
      - name: Install dependencies
        run: |
          if [ -d "Neurochip" ] && [ -f "Neurochip/pyproject.toml" ]; then
            python -m pip install poetry
            cd Neurochip
            poetry install --no-interaction
          else
            echo "Submodule missing, skipping"
          fi
      - name: Lint with ruff
        run: |
          if [ -d "Neurochip" ] && [ -f "Neurochip/pyproject.toml" ]; then
            cd Neurochip
            poetry run ruff check .
            poetry run ruff format --check .
          fi
        continue-on-error: true # Allow for now if not configured
      - name: Type check with mypy
        run: |
          if [ -d "Neurochip" ] && [ -f "Neurochip/pyproject.toml" ]; then
            cd Neurochip
            poetry run mypy .
          fi
      - name: Run tests
        run: |
          if [ -d "Neurochip" ] && [ -f "Neurochip/pyproject.toml" ]; then
            cd Neurochip
            poetry run pytest --tb=short --hypothesis-show-statistics
          fi

  test-neurosense:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurosense == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Update submodule
        run: git submodule update --init Neurosense || true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
      - name: Python diagnostics
        run: |
          python --version
          python -m pip --version
          if [ "$RUNNER_OS" = "Windows" ]; then
            where python || true
            where pytest || true
          else
            which python || true
            which pytest || true
          fi
      - name: Install dependencies
        run: |
          if [ -d "Neurosense/neurosense" ] && [ -f "Neurosense/pyproject.toml" ]; then
            python -m pip install -e "./Neurosense[dev]"
            python -m pip install ruff mypy
          else
            echo "Submodule missing, skipping"
          fi
      - name: Lint with ruff
        run: |
          if [ -d "Neurosense/neurosense" ] && [ -f "Neurosense/pyproject.toml" ]; then
            cd Neurosense
            python -m ruff check .
            python -m ruff format --check .
          fi
      - name: Type check with mypy
        run: |
          if [ -d "Neurosense/neurosense" ] && [ -f "Neurosense/pyproject.toml" ]; then
            cd Neurosense
            python -m mypy neurosense
          fi
      - name: Run tests
        run: |
          if [ -d "Neurosense/neurosense" ] && [ -f "Neurosense/pyproject.toml" ]; then
            cd Neurosense
            python -m pytest --tb=short --hypothesis-show-statistics
          fi

  test-neurohub:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurohub == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
