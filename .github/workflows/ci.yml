          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify macOS signing release plumbing
        run: python -m pytest tests/test_macos_installer_signing.py -v --tb=short --noconftest

  test-windows-installer-signing:
