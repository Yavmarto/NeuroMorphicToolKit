name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      neurosim: ${{ steps.filter.outputs.neurosim }}
      neurochip: ${{ steps.filter.outputs.neurochip }}
      neurosense: ${{ steps.filter.outputs.neurosense }}
      neurohub: ${{ steps.filter.outputs.neurohub }}
      neurodreamhand: ${{ steps.filter.outputs.neurodreamhand }}
      neurocnl: ${{ steps.filter.outputs.neurocnl }}
      neurobench: ${{ steps.filter.outputs.neurobench }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            neurosim:
              - 'Neurosim/**'
            neurochip:
              - 'Neurochip/**'
            neurosense:
              - 'Neurosense/**'
            neurohub:
              - 'Neurohub/**'
            neurodreamhand:
              - 'Neuro-Dream-Hand/**'
            neurocnl:
              - 'neurocnl/**'
            neurobench:
              - 'Neurobench/**'

  test-neurosim:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurosim == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurosim
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e . && pip install pytest httpx
      - name: Run tests
        run: pytest --tb=short

  test-neurochip:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurochip == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurochip/neurochip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install poetry && poetry install
      - name: Run tests
        run: poetry run pytest --tb=short

  test-neurosense:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurosense == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurosense/neurosense
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --tb=short

  test-neurohub:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurohub == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurohub/neurohub
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e . && pip install pytest httpx
      - name: Run tests
        run: pytest --tb=short

  test-neurodreamhand:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurodreamhand == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neuro-Dream-Hand
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e . && pip install pytest
      - name: Run tests
        run: pytest --tb=short

  test-neurocnl-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurocnl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core package
        working-directory: neurocnl
        run: pip install -e . && pip install pytest httpx
      - name: Install backend deps
        working-directory: neurocnl/backend
        run: pip install -r requirements.txt
      - name: Run core tests
        working-directory: neurocnl
        run: pytest neurocnl/ --tb=short
      - name: Run backend tests
        working-directory: neurocnl/backend
        run: pytest --tb=short

  # Summary job that branch protection can require
  ci-passed:
    runs-on: ubuntu-latest
    needs:
      - test-neurosim
      - test-neurochip
      - test-neurosense
      - test-neurohub
      - test-neurodreamhand
      - test-neurocnl-backend
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Results:"
          echo "  neurosim:       ${{ needs.test-neurosim.result }}"
          echo "  neurochip:      ${{ needs.test-neurochip.result }}"
          echo "  neurosense:     ${{ needs.test-neurosense.result }}"
          echo "  neurohub:       ${{ needs.test-neurohub.result }}"
          echo "  neurodreamhand: ${{ needs.test-neurodreamhand.result }}"
          echo "  neurocnl:       ${{ needs.test-neurocnl-backend.result }}"

          # Fail if any job failed (skipped is OK — means no changes in that module)
          for result in \
            "${{ needs.test-neurosim.result }}" \
            "${{ needs.test-neurochip.result }}" \
            "${{ needs.test-neurosense.result }}" \
            "${{ needs.test-neurohub.result }}" \
            "${{ needs.test-neurodreamhand.result }}" \
            "${{ needs.test-neurocnl-backend.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more test jobs failed"
              exit 1
            fi
          done
          echo "All checks passed (or were skipped)"
