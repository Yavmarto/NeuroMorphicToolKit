name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      neurosim: ${{ steps.filter.outputs.neurosim }}
      neurochip: ${{ steps.filter.outputs.neurochip }}
      neurochip_frontend: ${{ steps.filter.outputs.neurochip_frontend }}
      neurosense: ${{ steps.filter.outputs.neurosense }}
      neurosense_frontend: ${{ steps.filter.outputs.neurosense_frontend }}
      neurohub: ${{ steps.filter.outputs.neurohub }}
      neurohub_frontend: ${{ steps.filter.outputs.neurohub_frontend }}
      neurodreamhand: ${{ steps.filter.outputs.neurodreamhand }}
      neurocnl: ${{ steps.filter.outputs.neurocnl }}
      neurocnl_frontend: ${{ steps.filter.outputs.neurocnl_frontend }}
      neurobench: ${{ steps.filter.outputs.neurobench }}
      neurobench_frontend: ${{ steps.filter.outputs.neurobench_frontend }}
      neurotoolkit: ${{ steps.filter.outputs.neurotoolkit }}
      nmtk_ui_core: ${{ steps.filter.outputs.nmtk_ui_core }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            neurosim:
              - 'Neurosim/**'
            neurochip:
              - 'Neurochip/neurochip/**'
            neurochip_frontend:
              - 'Neurochip/frontend/**'
              - 'nmtk_ui_core/**'
            neurosense:
              - 'Neurosense/neurosense/**'
            neurosense_frontend:
              - 'Neurosense/frontend/**'
              - 'nmtk_ui_core/**'
            neurohub:
              - 'Neurohub/neurohub/**'
            neurohub_frontend:
              - 'Neurohub/frontend/**'
              - 'nmtk_ui_core/**'
            neurodreamhand:
              - 'Neuro-Dream-Hand/**'
            neurocnl:
              - 'neurocnl/**'
              - '!neurocnl/frontend/**'
            neurocnl_frontend:
              - 'neurocnl/frontend/**'
              - 'nmtk_ui_core/**'
            neurobench:
              - 'Neurobench/neurobench/**'
            neurobench_frontend:
              - 'Neurobench/frontend/**'
              - 'nmtk_ui_core/**'
            neurotoolkit:
              - 'nmtk/neuro_toolkit/**'
              - 'nmtk_ui_core/**'
            nmtk_ui_core:
              - 'nmtk_ui_core/**'

  test-neurosim:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurosim == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurosim
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e . && pip install pytest httpx ruff mypy
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Type check with mypy
        run: mypy .
      - name: Run tests
        run: pytest --tb=short --hypothesis-show-statistics

  test-neurochip:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurochip == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurochip/neurochip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install poetry && poetry install
      - name: Lint with ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
        continue-on-error: true # Allow for now if not configured
      - name: Type check with mypy
        run: poetry run mypy .
      - name: Run tests
        run: poetry run pytest --tb=short --hypothesis-show-statistics

  test-neurosense:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurosense == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurosense/neurosense
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e ".[dev]" && pip install ruff mypy
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Type check with mypy
        run: mypy .
      - name: Run tests
        run: pytest --tb=short --hypothesis-show-statistics

  test-neurohub:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurohub == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurohub/neurohub
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e . && pip install pytest httpx ruff mypy
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Type check with mypy
        run: mypy .
      - name: Run tests
        run: pytest --tb=short --hypothesis-show-statistics

  test-neurodreamhand:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurodreamhand == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neuro-Dream-Hand
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e . && pip install pytest ruff mypy
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Type check with mypy
        run: mypy .
      - name: Run tests
        run: pytest --tb=short --hypothesis-show-statistics

  test-neurocnl-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurocnl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update required submodules
        run: |
          git submodule update --init neurocnl || true
          git submodule update --init Neuro-Dream-Hand || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core package
        run: |
          if [ -d "neurocnl" ] && [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            pip install -e . && pip install pytest httpx ruff mypy
          else
            echo "neurocnl missing, skipping install"
          fi
      - name: Install Neuro-Dream-Hand
        run: |
          if [ -d "Neuro-Dream-Hand" ] && [ -f "Neuro-Dream-Hand/pyproject.toml" ]; then
            pip install -e ./Neuro-Dream-Hand
          else
            echo "Neuro-Dream-Hand missing, skipping install"
          fi
      - name: Lint with ruff
        run: |
          if [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            ruff check .
            ruff format --check .
          else
            echo "neurocnl missing, skipping lint"
          fi
      - name: Type check with mypy
        run: |
          if [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            mypy .
          else
            echo "neurocnl missing, skipping type check"
          fi
      - name: Install backend deps
        run: |
          if [ -f "neurocnl/backend/requirements.txt" ]; then
            cd neurocnl/backend
            pip install -r requirements.txt
          else
            echo "neurocnl/backend missing, skipping backend deps"
          fi
      - name: Run core tests
        run: |
          if [ -f "neurocnl/pyproject.toml" ]; then
            cd neurocnl
            pytest neurocnl/ --tb=short
          else
            echo "neurocnl missing, skipping core tests"
          fi
      - name: Run backend tests
        run: |
          if [ -f "neurocnl/backend/requirements.txt" ]; then
            cd neurocnl/backend
            pytest --tb=short
          else
            echo "neurocnl/backend missing, skipping backend tests"
          fi

  test-neurobench:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurobench == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurobench/neurobench
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Lint with ruff
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Type check with mypy
        run: poetry run mypy .
      - name: Run tests
        run: poetry run pytest --tb=short --hypothesis-show-statistics

  test-nmtk-ui-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.nmtk_ui_core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nmtk_ui_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  test-neurotoolkit:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurotoolkit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nmtk/neuro_toolkit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  test-neurocnl-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurocnl_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neurocnl/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  test-neurochip-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurochip_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurochip/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  test-neurohub-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurohub_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurohub/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  test-neurosense-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurosense_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurosense/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  test-neurobench-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.neurobench_frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Neurobench/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze

  # Summary job that branch protection can require
  ci-passed:
    runs-on: ubuntu-latest
    needs:
      - test-neurosim
      - test-neurochip
      - test-neurochip-frontend
      - test-neurosense
      - test-neurosense-frontend
      - test-neurohub
      - test-neurohub-frontend
      - test-neurodreamhand
      - test-neurobench
      - test-neurocnl-backend
      - test-neurocnl-frontend
      - test-neurobench-frontend
      - test-neurotoolkit
      - test-nmtk-ui-core
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Results:"
          echo "  neurosim:       ${{ needs.test-neurosim.result }}"
          echo "  neurochip:      ${{ needs.test-neurochip.result }}"
          echo "  neurosense:     ${{ needs.test-neurosense.result }}"
          echo "  neurohub:       ${{ needs.test-neurohub.result }}"
          echo "  neurodreamhand: ${{ needs.test-neurodreamhand.result }}"
          echo "  neurobench:     ${{ needs.test-neurobench.result }}"
          echo "  neurocnl:       ${{ needs.test-neurocnl-backend.result }}"
          echo "  nmtk-ui-core:   ${{ needs.test-nmtk-ui-core.result }}"
          echo "  neurotoolkit:   ${{ needs.test-neurotoolkit.result }}"

          # Fail if any job failed (skipped is OK — means no changes in that module)
          for result in \
            "${{ needs.test-neurosim.result }}" \
            "${{ needs.test-neurochip.result }}" \
            "${{ needs.test-neurochip-frontend.result }}" \
            "${{ needs.test-neurosense.result }}" \
            "${{ needs.test-neurosense-frontend.result }}" \
            "${{ needs.test-neurohub.result }}" \
            "${{ needs.test-neurohub-frontend.result }}" \
            "${{ needs.test-neurodreamhand.result }}" \
            "${{ needs.test-neurobench.result }}" \
            "${{ needs.test-neurobench-frontend.result }}" \
            "${{ needs.test-neurocnl-backend.result }}" \
            "${{ needs.test-neurocnl-frontend.result }}" \
            "${{ needs.test-nmtk-ui-core.result }}" \
            "${{ needs.test-neurotoolkit.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more test jobs failed"
              exit 1
            fi
          done
          echo "All checks passed (or were skipped)"
