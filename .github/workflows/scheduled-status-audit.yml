name: Scheduled Weekly Status Audit

on:
  schedule:
    # Runs at 08:00 UTC on Mondays (Start of week planning)
    - cron: '0 8 * * 1'
    # Runs at 16:00 UTC on Fridays (End of week review)
    - cron: '0 16 * * 5'
  workflow_dispatch: # Alway good to have a manual override

jobs:
  execute-audit:
    strategy:
      fail-fast: false
      matrix:
        module: [
          'neurocnl',
          'Neurosim',
          'Neurosense',
          'Neurohub',
          'Neurochip',
          'Neurobench',
          'Neuro-Dream-Hand',
          '.'
        ]
    # Calls the reusable workflow we just created
    uses: ./.github/workflows/reusable-status-audit.yml
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      JULES_API_KEY_F: ${{ secrets.JULES_API_KEY_F }}
    with:
      agent_name: 'Jules (Scheduled Auditor)'
      target_directory: ${{ matrix.module }}
