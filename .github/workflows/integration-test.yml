name: Cross-Module Integration Test

# Spins up all HTTP modules via Docker and verifies they can communicate.
# Runs after CI passes on dev, or manually.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install httpx pytest

      - name: Discover and start Docker modules
        id: docker
        run: |
          echo "## Integration Test" >> "$GITHUB_STEP_SUMMARY"
          STARTED=""

          for dir in Neurochip/neurochip Neurosense/neurosense Neurohub/neurohub neurocnl Neurobench/neurobench; do
            MODULE=$(basename "$dir")
            # Prefer docker-compose
            if [ -f "$dir/docker-compose.yml" ]; then
              echo "Starting $MODULE via docker-compose..."
              docker compose -f "$dir/docker-compose.yml" up -d 2>/dev/null || echo "⚠ Failed to start $MODULE"
              STARTED="$STARTED $MODULE"
            elif [ -f "$dir/docker-compose.yaml" ]; then
              docker compose -f "$dir/docker-compose.yaml" up -d 2>/dev/null || echo "⚠ Failed to start $MODULE"
              STARTED="$STARTED $MODULE"
            elif [ -f "$dir/Dockerfile" ]; then
              echo "Building $MODULE from Dockerfile..."
              docker build -t "nmtk-$MODULE" "$dir" 2>/dev/null && \
              docker run -d --name "nmtk-$MODULE" --network host "nmtk-$MODULE" 2>/dev/null || \
              echo "⚠ Failed to build/start $MODULE"
              STARTED="$STARTED $MODULE"
            fi
          done

          echo "started=$STARTED" >> "$GITHUB_OUTPUT"
          echo "Started modules: $STARTED" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for services to be ready
        run: sleep 15

      - name: Health check all modules
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Health Checks" >> "$GITHUB_STEP_SUMMARY"

          python3 -c "
          import httpx, sys

          # Known module ports (from scaffold convention, default 8000)
          modules = {
              'neurocnl':  8000,
              'neurosim':  8000,
              'neurochip': 8002,
              'neurobench': 8003,
              'neurosense': 8004,
              'neurohub':  8005,
          }

          failed = 0
          for name, port in modules.items():
              try:
                  r = httpx.get(f'http://localhost:{port}/health', timeout=5)
                  if r.status_code == 200:
                      print(f'✓ {name} (:{port}) — healthy')
                  else:
                      print(f'✗ {name} (:{port}) — status {r.status_code}')
                      failed += 1
              except Exception as e:
                  print(f'○ {name} (:{port}) — not running ({e.__class__.__name__})')

          sys.exit(1 if failed > 0 else 0)
          " | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down 2>/dev/null || true
          docker ps -q --filter "name=nmtk-" | xargs -r docker stop 2>/dev/null || true
          docker ps -aq --filter "name=nmtk-" | xargs -r docker rm 2>/dev/null || true
