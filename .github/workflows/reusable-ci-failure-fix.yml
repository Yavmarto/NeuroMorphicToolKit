name: Reusable CI Failure Fix

on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      workflow_url:
        required: true
        type: string
      head_branch:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      run_id:
        required: true
        type: string
    secrets:
      JULES_API_KEY:
        required: true
      JULES_API_KEY_F:
        required: false

jobs:
  sdd-context:
    uses: Completed-Spoon-6/NeuroMorphicToolKit/.github/workflows/sdd-context-bridge.yml@dev

  fix-failure:
    needs: sdd-context
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download logs URL
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ inputs.run_id }},
            });
            core.setOutput("logs_url", response.url);

      - name: Invoke Jules to fix failure (primary key)
        id: jules-primary
        continue-on-error: true
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            The workflow run failed and needs a focused fix.

            Workflow: ${{ inputs.workflow_name }}
            Run URL: ${{ inputs.workflow_url }}
            Logs URL: ${{ steps.logs.outputs.logs_url }}
            Branch: ${{ inputs.head_branch }}
            Commit: ${{ inputs.head_sha }}

            Requirements:
            1. Read the failed jobs and logs.
            2. Fix only the root cause.
            3. Do not weaken tests, contracts, or property checks.
            4. Read the relevant AGENTS.md and GUARDRAILS.md before making changes.
            5. Open a PR from a jules/* branch so auto-merge can attach once checks pass.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ inputs.head_branch }}
          include_last_commit: true

      - name: Invoke Jules to fix failure (fallback key)
        id: jules-fallback
        if: steps.jules-primary.outcome == 'failure'
        continue-on-error: true
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            The workflow run failed and needs a focused fix.

            Workflow: ${{ inputs.workflow_name }}
            Run URL: ${{ inputs.workflow_url }}
            Logs URL: ${{ steps.logs.outputs.logs_url }}
            Branch: ${{ inputs.head_branch }}
            Commit: ${{ inputs.head_sha }}

            Requirements:
            1. Read the failed jobs and logs.
            2. Fix only the root cause.
            3. Do not weaken tests, contracts, or property checks.
            4. Read the relevant AGENTS.md and GUARDRAILS.md before making changes.
            5. Open a PR from a jules/* branch so auto-merge can attach once checks pass.
          jules_api_key: ${{ secrets.JULES_API_KEY_F }}
          starting_branch: ${{ inputs.head_branch }}
          include_last_commit: true

      - name: Invoke Jules to fix failure (retry primary key)
        if: steps.jules-primary.outcome == 'failure' && steps.jules-fallback.outcome == 'failure'
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            The workflow run failed and needs a focused fix.

            Workflow: ${{ inputs.workflow_name }}
            Run URL: ${{ inputs.workflow_url }}
            Logs URL: ${{ steps.logs.outputs.logs_url }}
            Branch: ${{ inputs.head_branch }}
            Commit: ${{ inputs.head_sha }}

            Requirements:
            1. Read the failed jobs and logs.
            2. Fix only the root cause.
            3. Do not weaken tests, contracts, or property checks.
            4. Read the relevant AGENTS.md and GUARDRAILS.md before making changes.
            5. Open a PR from a jules/* branch so auto-merge can attach once checks pass.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ inputs.head_branch }}
          include_last_commit: true
