name: Release Promote (dev → main)

# Merges dev into main across the parent repo and all submodules.
# Creates a release tag on each. Manual trigger only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — show what would happen without pushing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  promote:
    # Pure git work — no reason to wait on a self-hosted machine.
    runs-on: ${{ vars.RELEASE_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          # GITHUB_TOKEN is scoped to this repository only: it can neither read
          # nor push the sibling submodule repositories this job merges and
          # tags. NMTK_SUBMODULE_TOKEN needs *write* access for this workflow,
          # unlike the read-only use in release-docker.yml.
          token: ${{ secrets.NMTK_SUBMODULE_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote submodules (dev → main)
        # VERSION was previously only exported on the parent-repo step below, so
        # `git tag "$VERSION"` here expanded to an empty tag name, failed, and
        # was swallowed by the `||` — submodules were merged but never tagged.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          FAILED=""
          # shellcheck disable=SC2016
          git submodule foreach --quiet '
            echo "=== Promoting $name ==="
            git fetch origin dev main 2>/dev/null || { echo "  ⚠ Could not fetch $name, skipping"; exit 0; }

            # Check if dev is ahead of main
            BEHIND=$(git rev-list --count origin/main..origin/dev 2>/dev/null || echo "0")
            if [ "$BEHIND" = "0" ]; then
              echo "  ✓ $name: main is up to date with dev"
              exit 0
            fi

            echo "  → $name: dev is $BEHIND commits ahead of main"
            git checkout main
            git merge origin/dev --no-edit
            git tag "$VERSION" || echo "  ⚠ Tag already exists in $name"

            if [ "${{ inputs.dry_run }}" = "false" ]; then
              git push origin main --tags || exit 1
              echo "  ✓ $name: pushed main + tag"
            else
              echo "  [DRY RUN] Would push main + tag for $name"
            fi
          ' || FAILED="true"

          if [ "$FAILED" = "true" ]; then
            echo "$FAILED"
            exit 1
          fi

      - name: Promote parent repo (dev → main)
        run: |
          git fetch origin dev main
          git checkout main
          git merge origin/dev --no-edit

          # Update submodule pointers to their new main HEADs
          git submodule foreach 'git checkout main 2>/dev/null || true'
          git add -A
          git diff --cached --quiet || git commit -m "chore: update submodule pointers for $VERSION"
          git tag "$VERSION" || echo "Tag already exists"

          if [ "$DRY_RUN" = "false" ]; then
            git push origin main --tags
            echo "✓ Parent repo promoted and tagged"
          else
            echo "[DRY RUN] Would push main + tag for parent repo"
          fi
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Summary
        run: |
          echo "## Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DRY_RUN" = "true" ]; then
            echo "🏃 **Dry run** — no changes were pushed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ All modules promoted from \`dev\` → \`main\` and tagged \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
