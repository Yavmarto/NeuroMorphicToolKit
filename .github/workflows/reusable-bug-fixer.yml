name: Reusable Bug Fixer

on:
  workflow_call:
    inputs:
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      sender_login:
        required: true
        type: string
      trusted_users:
        description: 'JSON array of trusted GitHub usernames'
        required: false
        type: string
        default: '["your-github-username"]'
    secrets:
      JULES_API_KEY:
        required: true
      JULES_API_KEY_F:
        required: false

jobs:
  sdd-context:
    uses: ./.github/workflows/sdd-context-bridge.yml

  fix-bug:
    needs: sdd-context
    if: ${{ contains(fromJSON(inputs.trusted_users), inputs.sender_login) }}
    runs-on: self-hosted
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Select API key (round-robin)
        id: select-key
        run: |
          if [ $(( ${{ github.run_number }} % 2 )) -eq 0 ]; then
            echo "::add-mask::${KEY_A}"
            echo "selected_key=${KEY_A}" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::${KEY_B}"
            echo "selected_key=${KEY_B}" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEY_A: ${{ secrets.JULES_API_KEY }}
          KEY_B: ${{ secrets.JULES_API_KEY_F || secrets.JULES_API_KEY }}

      - name: Invoke Jules to fix bug
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ steps.select-key.outputs.selected_key }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Fix the following bug
            ════════════════════════════════════════

            ## ${{ inputs.issue_title }}

            ${{ inputs.issue_body }}

            Debugging Process:
            1. **Analysis** - Review the bug report and identify the root cause
            2. **Diagnosis** - Trace the issue through the codebase
            3. **Fix** - Implement a minimal, targeted fix
            4. **Testing** - Add a regression test that would have caught this bug
            5. **Documentation** - Add comments explaining the fix

            Please provide:
            - Clear explanation of the root cause
            - The complete fix with all necessary changes
            - Test cases to prevent regression
