name: Auto-Resolve Merge Conflicts

# Triggers automatically whenever:
#   1. A PR is opened/updated against dev/main
#   2. Something is pushed to dev/main (which can cause existing PRs to conflict)
#
# No labels needed — Jules is invoked automatically on any conflicted PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main, master]

  push:
    branches: [dev, main, master]

jobs:
  # Step 1: Scan all open PRs and find which ones have conflicts
  detect:
    name: Detect conflicted PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      found:  ${{ steps.scan.outputs.found }}

    steps:
      - name: Checkout (full history for merge simulation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Find conflicted PRs
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On a pull_request event: check only the triggering PR
          # On a push event: check all open PRs targeting the branch that was pushed to
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PRS=$(jq -n \
              --arg num "${{ github.event.pull_request.number }}" \
              --arg head "${{ github.event.pull_request.head.ref }}" \
              --arg base "${{ github.event.pull_request.base.ref }}" \
              '[{"number": ($num | tonumber), "headRefName": $head, "baseRefName": $base}]')
          else
            PRS=$(gh pr list \
              --state open \
              --base "${{ github.ref_name }}" \
              --json number,headRefName,baseRefName)
          fi

          CONFLICTED="[]"

          echo "$PRS" | jq -c '.[]' | while IFS= read -r PR; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR"  | jq -r '.headRefName')
            BASE_REF=$(echo "$PR"  | jq -r '.baseRefName')

            echo "Checking PR #$PR_NUMBER ($HEAD_REF → $BASE_REF)..."

            git fetch origin "$HEAD_REF" "$BASE_REF" 2>/dev/null || {
              echo "  Could not fetch — skipping."
              continue
            }

            git checkout -B "$HEAD_REF" "origin/$HEAD_REF" 2>/dev/null
            git merge --no-commit --no-ff "origin/$BASE_REF" 2>/dev/null || true
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ',')
            git merge --abort 2>/dev/null || true
            git checkout - 2>/dev/null || true

            if [ -n "$CONFLICTS" ]; then
              echo "  ⚠️  PR #$PR_NUMBER has conflicts: $CONFLICTS"
              echo "$PR_NUMBER $HEAD_REF $BASE_REF $CONFLICTS" >> /tmp/conflicted.txt
            else
              echo "  ✅ PR #$PR_NUMBER is clean."
            fi
          done

          if [ -f /tmp/conflicted.txt ] && [ -s /tmp/conflicted.txt ]; then
            # Build a JSON matrix from the conflicted list
            MATRIX=$(awk '{print "{\"pr_number\":\""$1"\",\"head_ref\":\""$2"\",\"base_ref\":\""$3"\",\"conflict_files\":\""$4"\"}"}' /tmp/conflicted.txt | jq -s '.')
            echo "found=true"  >> "$GITHUB_OUTPUT"
            echo "matrix=$(echo $MATRIX | jq -c '.')" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "matrix=[]"   >> "$GITHUB_OUTPUT"
          fi

  # Step 2: For each conflicted PR, invoke Jules to fix it
  fix:
    name: Fix conflicts in PR #${{ matrix.pr.pr_number }}
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pr: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Invoke Jules to resolve conflicts
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            PR #${{ matrix.pr.pr_number }} has merge conflicts that need to be resolved.

            **Head branch (this PR):** ${{ matrix.pr.head_ref }}
            **Base branch (merge target):** ${{ matrix.pr.base_ref }}
            **Conflicted files:** ${{ matrix.pr.conflict_files }}

            Resolution steps:
            1. Check out branch `${{ matrix.pr.head_ref }}`
            2. Run `git merge origin/${{ matrix.pr.base_ref }}` to surface conflict markers
            3. For every conflict block (`<<<<<<< HEAD` … `=======` … `>>>>>>>`):
               - Understand the intent of BOTH sides
               - Prefer the head branch logic for changes introduced by this PR
               - Preserve base branch changes that are unrelated to this PR's scope
               - If both sides changed the same logic, merge them semantically
            4. Run the test suite to verify nothing is broken
            5. Stage all resolved files with `git add`
            6. Commit: `fix: resolve merge conflicts with ${{ matrix.pr.base_ref }}`
            7. Push to `${{ matrix.pr.head_ref }}` (do NOT create a new branch)
            8. Add a PR comment listing which files were resolved and how

            Constraints:
            - Do NOT change any logic outside of conflict blocks
            - Do NOT squash or rebase — only resolve and commit
            - If a conflict is in a lock file (pubspec.lock, poetry.lock, etc.),
              regenerate it with the appropriate package manager instead of editing manually
            - If a conflict cannot be confidently resolved, leave a TODO comment and note it in the PR
