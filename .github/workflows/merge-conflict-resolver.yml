name: Auto-Resolve Merge Conflicts

# Triggers automatically whenever:
#   1. A PR is opened/updated against dev/main — checks that PR for conflicts
#   2. Something is pushed to dev/main — scans all open PRs for new conflicts
#
# No labels needed. Jules is invoked automatically via a reusable workflow
# to avoid action resolution issues in the pull_request context.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, main, master]

  push:
    branches: [dev, main, master]

jobs:
  # Step 1: Detect which PRs have conflicts
  detect:
    name: Detect conflicted PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      conflicted: ${{ steps.scan.outputs.conflicted }}
      found:      ${{ steps.scan.outputs.found }}

    steps:
      - name: Checkout (full history for merge simulation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Find conflicted PRs
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Only check the triggering PR
            PRS=$(jq -n \
              --arg num  "${{ github.event.pull_request.number }}" \
              --arg head "${{ github.event.pull_request.head.ref }}" \
              --arg base "${{ github.event.pull_request.base.ref }}" \
              '[{"number": ($num|tonumber), "headRefName": $head, "baseRefName": $base}]')
          else
            # On push: check all open PRs targeting the pushed branch
            PRS=$(gh pr list \
              --state open \
              --base "${{ github.ref_name }}" \
              --json number,headRefName,baseRefName)
          fi

          RESULT="[]"

          while IFS= read -r PR; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR"  | jq -r '.headRefName')
            BASE_REF=$(echo "$PR"  | jq -r '.baseRefName')

            echo "Checking PR #$PR_NUMBER ($HEAD_REF → $BASE_REF)..."

            git fetch origin "$HEAD_REF" "$BASE_REF" 2>/dev/null || {
              echo "  Could not fetch — skipping."
              continue
            }

            git checkout -B "$HEAD_REF" "origin/$HEAD_REF" 2>/dev/null
            git merge --no-commit --no-ff "origin/$BASE_REF" 2>/dev/null || true
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ' | xargs)
            git merge --abort 2>/dev/null || true
            git checkout - 2>/dev/null || true

            if [ -n "$CONFLICTS" ]; then
              echo "  ⚠️  PR #$PR_NUMBER has conflicts: $CONFLICTS"
              ENTRY=$(jq -n \
                --argjson num "$PR_NUMBER" \
                --arg head "$HEAD_REF" \
                --arg base "$BASE_REF" \
                --arg files "$CONFLICTS" \
                '{"pr_number": $num, "head_ref": $head, "base_ref": $base, "conflict_files": $files}')
              RESULT=$(echo "$RESULT" | jq --argjson e "$ENTRY" '. + [$e]')
            else
              echo "  ✅ PR #$PR_NUMBER is clean."
            fi
          done < <(echo "$PRS" | jq -c '.[]')

          COUNT=$(echo "$RESULT" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "found=true"                          >> "$GITHUB_OUTPUT"
            echo "conflicted=$(echo $RESULT | jq -c '.')" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "conflicted=[]" >> "$GITHUB_OUTPUT"
          fi

  # Step 2: Fix each conflicted PR via the reusable workflow (avoids direct
  # jules-invoke in pull_request context which has action resolution issues)
  fix-pr-1:
    name: Fix PR (slot 1)
    needs: detect
    if: needs.detect.outputs.found == 'true' && fromJson(needs.detect.outputs.conflicted)[0] != null
    uses: Yavmarto/NeuroMorphicToolKit/.github/workflows/reusable-merge-conflict-fixer.yml@main
    with:
      pr_number:      ${{ fromJson(needs.detect.outputs.conflicted)[0].pr_number }}
      head_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[0].head_ref }}
      base_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[0].base_ref }}
      conflict_files: ${{ fromJson(needs.detect.outputs.conflicted)[0].conflict_files }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}

  fix-pr-2:
    name: Fix PR (slot 2)
    needs: detect
    if: needs.detect.outputs.found == 'true' && fromJson(needs.detect.outputs.conflicted)[1] != null
    uses: Yavmarto/NeuroMorphicToolKit/.github/workflows/reusable-merge-conflict-fixer.yml@main
    with:
      pr_number:      ${{ fromJson(needs.detect.outputs.conflicted)[1].pr_number }}
      head_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[1].head_ref }}
      base_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[1].base_ref }}
      conflict_files: ${{ fromJson(needs.detect.outputs.conflicted)[1].conflict_files }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}

  fix-pr-3:
    name: Fix PR (slot 3)
    needs: detect
    if: needs.detect.outputs.found == 'true' && fromJson(needs.detect.outputs.conflicted)[2] != null
    uses: Yavmarto/NeuroMorphicToolKit/.github/workflows/reusable-merge-conflict-fixer.yml@main
    with:
      pr_number:      ${{ fromJson(needs.detect.outputs.conflicted)[2].pr_number }}
      head_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[2].head_ref }}
      base_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[2].base_ref }}
      conflict_files: ${{ fromJson(needs.detect.outputs.conflicted)[2].conflict_files }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}

  fix-pr-4:
    name: Fix PR (slot 4)
    needs: detect
    if: needs.detect.outputs.found == 'true' && fromJson(needs.detect.outputs.conflicted)[3] != null
    uses: Yavmarto/NeuroMorphicToolKit/.github/workflows/reusable-merge-conflict-fixer.yml@main
    with:
      pr_number:      ${{ fromJson(needs.detect.outputs.conflicted)[3].pr_number }}
      head_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[3].head_ref }}
      base_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[3].base_ref }}
      conflict_files: ${{ fromJson(needs.detect.outputs.conflicted)[3].conflict_files }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}

  fix-pr-5:
    name: Fix PR (slot 5)
    needs: detect
    if: needs.detect.outputs.found == 'true' && fromJson(needs.detect.outputs.conflicted)[4] != null
    uses: Yavmarto/NeuroMorphicToolKit/.github/workflows/reusable-merge-conflict-fixer.yml@main
    with:
      pr_number:      ${{ fromJson(needs.detect.outputs.conflicted)[4].pr_number }}
      head_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[4].head_ref }}
      base_ref:       ${{ fromJson(needs.detect.outputs.conflicted)[4].base_ref }}
      conflict_files: ${{ fromJson(needs.detect.outputs.conflicted)[4].conflict_files }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
