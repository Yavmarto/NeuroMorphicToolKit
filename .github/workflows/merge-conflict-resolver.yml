name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [labeled]

  push:
    branches:
      - main
      - master

jobs:
  resolve-labeled-pr:
    name: Resolve conflict on labeled PR
    if: >
      github.event_name == 'pull_request' &&
      github.event.label.name == 'merge-conflict' &&
      contains(fromJSON('["your-github-username"]'), github.event.sender.login)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Detect conflicted files
        id: detect
        run: |
          git merge --no-commit --no-ff "origin/${{ github.event.pull_request.base.ref }}" || true
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          git merge --abort 2>/dev/null || true

          if [ -z "$CONFLICTS" ]; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true"  >> "$GITHUB_OUTPUT"
            echo "conflict_files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICTS"          >> "$GITHUB_OUTPUT"
            echo "EOF"                 >> "$GITHUB_OUTPUT"
          fi

      - name: Invoke Jules to resolve conflicts
        if: steps.detect.outputs.has_conflicts == 'true'
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            This PR has merge conflicts that need to be resolved.

            **PR:** #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
            **Head branch:** ${{ github.event.pull_request.head.ref }}
            **Base branch:** ${{ github.event.pull_request.base.ref }}

            **Conflicted files:**
            ${{ steps.detect.outputs.conflict_files }}

            Resolution process:
            1. Run `git merge origin/${{ github.event.pull_request.base.ref }}`
            2. For every conflict block, understand both sides and merge semantically
            3. Run the test suite to verify nothing is broken
            4. Stage, commit, and push to **${{ github.event.pull_request.head.ref }}**

            Constraints:
            - Do NOT change any logic outside conflict blocks
            - Do NOT squash or rebase
            - If conflict is in a lock file, regenerate it

      - name: Remove merge-conflict label on success
        if: steps.detect.outputs.has_conflicts == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "merge-conflict" \
            --repo "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment — no conflict found
        if: steps.detect.outputs.has_conflicts == 'false'
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "🟢 **Merge Conflict Resolver:** No conflict markers detected. The PR appears clean." \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  scan-and-resolve-on-push:
    name: Scan jules/* PRs for new conflicts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout default branch (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Find conflicted jules/* PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          PRS=$(gh pr list \
            --state open \
            --json number,headRefName,title,baseRefName \
            --jq '.[] | select(.headRefName | startswith("jules/")) | @json')

          if [ -z "$PRS" ]; then
            echo "No open jules/* PRs found."
            exit 0
          fi

          echo "$PRS" | while IFS= read -r PR_JSON; do
            PR_NUMBER=$(echo "$PR_JSON"  | jq -r '.number')
            HEAD_REF=$(echo "$PR_JSON"   | jq -r '.headRefName')
            BASE_REF=$(echo "$PR_JSON"   | jq -r '.baseRefName')
            PR_TITLE=$(echo "$PR_JSON"   | jq -r '.title')

            echo "────────────────────────────────────────"
            echo "Checking PR #$PR_NUMBER ($HEAD_REF → $BASE_REF): $PR_TITLE"

            git fetch origin "$HEAD_REF" "$BASE_REF" 2>/dev/null || {
              echo "Could not fetch branches for PR #$PR_NUMBER — skipping."
              continue
            }
            git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

            git merge --no-commit --no-ff "origin/$BASE_REF" 2>/dev/null || true
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git merge --abort 2>/dev/null || true

            if [ -z "$CONFLICTS" ]; then
              echo "PR #$PR_NUMBER is clean — no conflicts."
              continue
            fi

            echo "PR #$PR_NUMBER has conflicts — apply 'merge-conflict' label to trigger resolution."
            git checkout "$DEFAULT_BRANCH"
          done
