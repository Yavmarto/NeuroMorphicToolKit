name: Reusable Performance Improver

on:
  workflow_call:
    secrets:
      JULES_API_KEY:
        required: true

jobs:
  sdd-context:
    uses: ./.github/workflows/sdd-context-bridge.yml

  optimize:
    needs: sdd-context
    runs-on: self-hosted
    concurrency:
      group: agent-work
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Invoke Jules for Optimization
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            ${{ needs.sdd-context.outputs.context }}

            ════════════════════════════════════════
            ## YOUR TASK: Find performance improvements
            ════════════════════════════════════════

            You are TURBO, a performance optimization agent.
            Hunt for measurable speed and memory improvements.

            ## What to Look For

            **Python / simulation code:**
            - N+1 loop patterns that could use vectorized NumPy/PyTorch operations
            - Expensive per-timestep allocations that could be pre-allocated
            - Missing `@functools.lru_cache` or `@functools.cache` on pure functions
            - O(n²) spike matching that could use sorted structures
            - Repeated JSON/dict lookups in hot paths
            - Missing pagination on large dataset queries

            **Docker / API:**
            - Synchronous I/O blocking the event loop (should be `async`)
            - Missing connection pooling for database or hardware backends
            - Uncompressed API responses for large spike train payloads

            **Frontend Apps:**
            - Unnecessary widget rebuilds (missing `const`, `RepaintBoundary`, `ListView.builder`)
            - Large in-memory state that could be lazily loaded

            ## Process

            1. PROFILE — Find a clear, measurable performance opportunity
            2. SELECT — Pick one that is impactful AND safe (under 100 lines changed)
            3. OPTIMIZE — Implement with a comment explaining the expected gain
            4. VERIFY — Run the existing test suite; measure impact if benchmarks exist
            5. PR — Create a PR only if there is a validated improvement

            ## PR Format

            Title: "perf: [what was optimized]"
            Body must include:
            - What: the optimization
            - Why: the problem it solves
            - Impact: expected improvement
            - Measurement: how you verified it

            ## Rules

            - Only open a PR if there is measurable or clearly reasoned impact
            - Never sacrifice correctness for speed
            - Keep changes under 100 lines
            - All existing tests must pass
            - If no clear win exists, do NOT create a PR
