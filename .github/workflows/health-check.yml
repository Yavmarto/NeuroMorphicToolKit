name: Module Health Check

# Validates that all HTTP modules expose a /health endpoint and that
# inter-module API contracts are consistent. Runs after CI passes on dev.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure tool cache
        shell: bash
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx for health checks
        run: pip install httpx

      - name: Scan for Dockerfiles and docker-compose files
        id: scan
        run: |
          echo "## Module Discovery" >> "$GITHUB_STEP_SUMMARY"
          MODULES=""
          for dir in Neurosim Neurochip Neurosense Neurohub neurocnl Neuro-Dream-Hand Neurobench; do
            if [ -f "$dir/Dockerfile" ] || [ -f "$dir/docker-compose.yml" ] || [ -f "$dir/docker-compose.yaml" ]; then
              echo "- ✓ $dir has Docker config" >> "$GITHUB_STEP_SUMMARY"
              MODULES="$MODULES $dir"
            else
              echo "- ○ $dir: no Docker config found" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

      - name: Validate health endpoint declarations
        run: |
          echo "## Health Endpoint Audit" >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          for dir in Neurosim Neurochip Neurosense Neurohub neurocnl Neuro-Dream-Hand Neurobench; do
            # Search for /health route in Python files
            if [ -d "$dir" ]; then
              HEALTH=$(grep -rl '"/health"' "$dir" --include="*.py" 2>/dev/null || true)
              if [ -n "$HEALTH" ]; then
                echo "- ✓ **$dir**: /health endpoint found in: $HEALTH" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- ⚠ **$dir**: no /health endpoint found in Python sources" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

      - name: Validate API contract consistency
        run: |
          echo "## API Contract Check" >> "$GITHUB_STEP_SUMMARY"
          # Check that modules importing from other modules reference valid endpoints
          for dir in Neurosim Neurochip Neurosense Neurohub neurocnl Neuro-Dream-Hand Neurobench; do
            if [ -d "$dir" ]; then
              # Find cross-module HTTP calls
              CALLS=$(grep -rn 'localhost:\|127\.0\.0\.1:' "$dir" --include="*.py" 2>/dev/null || true)
              if [ -n "$CALLS" ]; then
                echo "- **$dir** makes cross-module calls:" >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
                echo "$CALLS" | head -10 >> "$GITHUB_STEP_SUMMARY"
                echo '```' >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Contract audit complete" >> "$GITHUB_STEP_SUMMARY"
