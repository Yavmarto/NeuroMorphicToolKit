name: Reusable Auto-Merge Jules PRs

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_ref:
        required: true
        type: string

jobs:
  auto-merge:
    if: ${{ startsWith(inputs.head_ref, 'jules/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge "${{ inputs.pr_number }}" \
            --auto \
            --squash \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
