name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Add Git to PATH (Windows)
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\cmd" echo C:\Program Files\Git\cmd>>%GITHUB_PATH%

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Windows Standalone
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & ./nmtk/installer/windows/build-standalone.ps1

      - name: Import Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_P12 != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12)
          $certPath = Join-Path $env:RUNNER_TEMP "signing_cert.p12"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          $securePass = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass
          Remove-Item $certPath

      - name: Sign Windows installer
        if: env.WINDOWS_SIGNING_THUMBPRINT != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $exe = Get-ChildItem -Path "nmtk\installer\windows" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found to sign"; exit 1 }
          .\nmtk\installer\windows\sign-installer.ps1 -InstallerPath $exe.FullName -Thumbprint $env:WINDOWS_SIGNING_THUMBPRINT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmtk-windows-installer
          path: nmtk/dist/*.exe

  build-macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Import macOS signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash nmtk/installer/macos/import-signing-cert.sh

      - name: Check macOS signing configuration
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash nmtk/installer/macos/sign-and-notarize.sh --check

      - name: Build macOS DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_ARGS=(--dmg)
          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            BUILD_ARGS+=(--sign "$MACOS_SIGNING_IDENTITY")
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              BUILD_ARGS+=(--notarize)
              export MACOS_NOTARIZE=true
            fi
          fi
          ./nmtk/installer/macos/build-standalone.sh "${BUILD_ARGS[@]}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmtk-macos-dmg
          path: "*.dmg"

  build-linux:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev libgcrypt20-dev libsecret-1-dev libsystemd-dev libwebkit2gtk-4.1-dev

      - name: Build Flutter Linux
        run: |
          cd nmtk/neuro_toolkit
          flutter build linux --release

      - name: Create AppImage
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ./nmtk/installer/linux/appimage.sh "$VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmtk-linux-appimage
          path: "*.AppImage"

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: [self-hosted, Linux, X64]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nmtk-windows-installer/*.exe
            nmtk-macos-dmg/*.dmg
            nmtk-linux-appimage/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: contains(github.ref, 'beta') || contains(github.ref, 'rc')
