name: Reusable Feature Builder

on:
  workflow_call:
    inputs:
      issue_title:
        required: true
        type: string
      issue_body:
        required: true
        type: string
      sender_login:
        required: true
        type: string
      trusted_users:
        description: 'JSON array of trusted GitHub usernames'
        required: false
        type: string
        default: '["Yavmarto"]'
      starting_branch:
        description: 'Branch Jules should base its work on'
        required: false
        type: string
        default: 'dev'
      trigger_label:
        description: 'Label that triggered this workflow'
        required: false
        type: string
        default: 'feature'
      issue_number:
        description: 'GitHub Issue Number'
        required: false
        type: string
    secrets:
      JULES_API_KEY:
        required: true
      JULES_API_KEY_F:
        required: false

jobs:
  sdd-context:
    uses: Completed-Spoon-6/NeuroMorphicToolKit/.github/workflows/sdd-context-bridge.yml@dev

  build-feature:
    needs: sdd-context
    if: ${{ contains(fromJSON(inputs.trusted_users), inputs.sender_login) }}
    runs-on: self-hosted
    steps:
      - name: Invoke Jules to build feature (primary key)
        id: jules-primary
        if: inputs.trigger_label == 'feature' || inputs.trigger_label == 'feature1' || inputs.trigger_label == 'agent'
        continue-on-error: true
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ inputs.starting_branch }}
          prompt: |
            # ${{ inputs.issue_title }}

            --- YOUR TASK: Implement the following feature ---

            ${{ needs.sdd-context.outputs.context }}

            ${{ inputs.issue_body }}

            Implementation Guidelines:
            1. **Understand** - Read the issue carefully, identify scope and acceptance criteria
            2. **Plan** - Identify which files need to change and why
            3. **Implement** - Write clean, idiomatic code following existing conventions
            4. **Test** - Add or update tests to cover the new functionality
            5. **PR** - Open a pull request with a clear description of what changed and why

            Constraints:
            - Follow existing code style and architecture patterns
            - Do not break existing tests
            - Keep changes focused — only change what is needed for this feature
            - If the issue is ambiguous, make the most reasonable interpretation
              and document your assumption in the PR body

            PR Linking:
            - Ensure the PR description includes 'Fixes #${{ inputs.issue_number }}' to organically link it to this issue.

      - name: Invoke Jules to build feature (fallback key)
        id: jules-fallback
        if: inputs.trigger_label == 'feature2' || ((inputs.trigger_label == 'feature' || inputs.trigger_label == 'agent') && steps.jules-primary.outcome == 'failure')
        continue-on-error: true
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY_F }}
          starting_branch: ${{ inputs.starting_branch }}
          prompt: |
            # ${{ inputs.issue_title }}

            --- YOUR TASK: Implement the following feature ---

            ${{ needs.sdd-context.outputs.context }}

            ${{ inputs.issue_body }}

            Implementation Guidelines:
            1. **Understand** - Read the issue carefully, identify scope and acceptance criteria
            2. **Plan** - Identify which files need to change and why
            3. **Implement** - Write clean, idiomatic code following existing conventions
            4. **Test** - Add or update tests to cover the new functionality
            5. **PR** - Open a pull request with a clear description of what changed and why

            Constraints:
            - Follow existing code style and architecture patterns
            - Do not break existing tests
            - Keep changes focused — only change what is needed for this feature
            - If the issue is ambiguous, make the most reasonable interpretation
              and document your assumption in the PR body

            PR Linking:
            - Ensure the PR description includes 'Fixes #${{ inputs.issue_number }}' to organically link it to this issue.

      - name: Invoke Jules to build feature (retry primary key)
        if: (inputs.trigger_label == 'feature' || inputs.trigger_label == 'agent') && steps.jules-primary.outcome == 'failure' && steps.jules-fallback.outcome == 'failure'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ inputs.starting_branch }}
          prompt: |
            # ${{ inputs.issue_title }}

            --- YOUR TASK: Implement the following feature ---

            ${{ needs.sdd-context.outputs.context }}

            ${{ inputs.issue_body }}

            Implementation Guidelines:
            1. **Understand** - Read the issue carefully, identify scope and acceptance criteria
            2. **Plan** - Identify which files need to change and why
            3. **Implement** - Write clean, idiomatic code following existing conventions
            4. **Test** - Add or update tests to cover the new functionality
            5. **PR** - Open a pull request with a clear description of what changed and why

            Constraints:
            - Follow existing code style and architecture patterns
            - Do not break existing tests
            - Keep changes focused — only change what is needed for this feature
            - If the issue is ambiguous, make the most reasonable interpretation
              and document your assumption in the PR body

            PR Linking:
            - Ensure the PR description includes 'Fixes #${{ inputs.issue_number }}' to organically link it to this issue.
