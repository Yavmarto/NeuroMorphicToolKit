# CDD-PBT Module CI — Reusable Workflow Template
#
# From GPT-5.4, adapted for unified pipeline paths.
# Called by per-module CI workflows to run setup → baseline → migration.
#
name: CDD-PBT Module CI

on:
  workflow_call:
    inputs:
      module_config:
        description: "Relative path to the module's module.json"
        required: true
        type: string
      python_version:
        description: "Python version to use"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, Linux, X64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Add Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitPath = "C:\Program Files\Git\cmd"
          if (Test-Path $gitPath) {
            "$gitPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: actions/checkout@v4

      - name: Configure tool cache
        run: |
          TOOL_CACHE="${RUNNER_TEMP}/_tool_cache"
          mkdir -p "$TOOL_CACHE"
          echo "AGENT_TOOLSDIRECTORY=$TOOL_CACHE" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install shared runner tools
        run: python -m pip install --upgrade pip

      - name: Run baseline and migration validation
        run: |
          python docs/unified-dev-pipeline/scripts/run_contract_ci.py \
            --config "${{ inputs.module_config }}" \
            --phase all
