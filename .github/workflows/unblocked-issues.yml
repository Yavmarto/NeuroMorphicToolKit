name: Work on Unblocked Issues

on:
  issues:
    types: [closed]

jobs:
  detect-unblocked:
    runs-on: self-hosted
    permissions:
      issues: read
    outputs:
      matrix: ${{ steps.finder.outputs.issues }}
      found: ${{ steps.finder.outputs.has_issues }}
    steps:
      - name: Find Unblocked Issues
        id: finder
        uses: google-labs-code/on-unblocked@v1

  implement:
    needs: detect-unblocked
    if: needs.detect-unblocked.outputs.found == 'true'
    strategy:
      matrix:
        issue-number: ${{ fromJson(needs.detect-unblocked.outputs.matrix) }}
    runs-on: self-hosted
    permissions:
      issues: read
    outputs:
      issue_title: ${{ steps.get_issue.outputs.issue_title }}
      issue_body: ${{ steps.get_issue.outputs.issue_body }}
      issue_author: ${{ steps.get_issue.outputs.issue_author }}

    steps:
      - name: Get issue details
        id: get_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ matrix.issue-number }}
            });
            core.setOutput('issue_title', issue.data.title);
            core.setOutput('issue_body', issue.data.body);
            core.setOutput('issue_author', issue.data.user.login);
            return issue.data;

  call-reusable:
    needs: [detect-unblocked, implement]
    if: needs.detect-unblocked.outputs.found == 'true'
    strategy:
      matrix:
        issue-number: ${{ fromJson(needs.detect-unblocked.outputs.matrix) }}
    uses: ./.github/workflows/reusable-unblocked-issues.yml
    with:
      issue_title: ${{ needs.implement.outputs.issue_title || 'Unblocked Issue' }}
      issue_body: ${{ needs.implement.outputs.issue_body || '' }}
      issue_author: ${{ needs.implement.outputs.issue_author || '' }}
      issue_number: ${{ matrix.issue-number }}
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      JULES_API_KEY_F: ${{ secrets.JULES_API_KEY_F }}
