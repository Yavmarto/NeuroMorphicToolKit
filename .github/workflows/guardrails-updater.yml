name: Guardrails Updater

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      failure_description:
        description: "Describe what went wrong (for manual guardrail creation)"
        required: true
        type: string

jobs:
  update-guardrails:
    name: Distil guardrail from rejected PR
    if: >
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'jules/') &&
       github.event.pull_request.merged == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Collect rejection context
        id: context
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const desc = context.payload.inputs.failure_description;
              core.setOutput('failure_context', `Manual guardrail request:\n\n${desc}`);
              core.setOutput('pr_number', 'manual');
              core.setOutput('pr_branch', 'manual');
              core.setOutput('closed_at', new Date().toISOString());
              return;
            }

            const owner    = context.repo.owner;
            const repo     = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const prTitle  = context.payload.pull_request.title;
            const prBody   = context.payload.pull_request.body || '(no description)';
            const prBranch = context.payload.pull_request.head.ref;
            const closedAt = context.payload.pull_request.closed_at;

            const reviews = await github.rest.pulls.listReviews({
              owner, repo, pull_number: prNumber
            });
            const reviewSummary = reviews.data
              .filter(r => r.body && r.body.trim())
              .map(r => `[${r.state}] @${r.user.login}: ${r.body}`)
              .join('\n') || '(no formal reviews submitted)';

            const inlineComments = await github.rest.pulls.listReviewComments({
              owner, repo, pull_number: prNumber
            });
            const inlineSummary = inlineComments.data
              .filter(c => c.body && c.body.trim())
              .map(c => `File \`${c.path}\` line ${c.line || '?'} — @${c.user.login}:\n  ${c.body}`)
              .join('\n---\n') || '(no inline comments)';

            const issueComments = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber
            });
            const discussionSummary = issueComments.data
              .filter(c => !c.user.login.includes('[bot]') && c.body.trim())
              .map(c => `@${c.user.login}: ${c.body}`)
              .join('\n') || '(no discussion comments)';

            const failureContext = [
              `## Rejected PR`,
              ``,
              `**PR #${prNumber}:** ${prTitle}`,
              `**Branch:** ${prBranch}`,
              `**Closed at:** ${closedAt}`,
              ``,
              `### PR Description`,
              prBody,
              ``,
              `### Formal Review Decisions`,
              reviewSummary,
              ``,
              `### Inline Code Review Comments`,
              inlineSummary,
              ``,
              `### Discussion`,
              discussionSummary,
            ].join('\n');

            core.setOutput('failure_context', failureContext);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('pr_branch', prBranch);
            core.setOutput('closed_at', closedAt);

      - name: Invoke Jules to distil guardrail (primary key)
        id: jules-primary
        continue-on-error: true
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            An agent-generated PR was rejected. Extract the lesson and add it
            as a new guardrail to GUARDRAILS.md.

            ## Rejection Context

            ${{ steps.context.outputs.failure_context }}

            ## Instructions

            1. Read the review comments. Identify the root cause.
            2. Open GUARDRAILS.md, find the highest Sign #N heading.
            3. Append a new Sign block:
               ```
               ## Sign #<N>: <Short imperative title>
               **What happened:** <1-2 sentences>
               **Root cause:** <1 sentence>
               **Rule:** <imperative: "DO NOT...", "ALWAYS USE...", "NEVER...">
               **Source:** PR #${{ steps.context.outputs.pr_number }}, closed ${{ steps.context.outputs.closed_at }}
               ---
               ```
            4. Check for duplicates — if similar exists, amend it instead.
            5. Open a PR on branch `jules/guardrails-sign-<N>`.

            Constraints:
            - Only modify GUARDRAILS.md
            - Keep guardrails precise and actionable
            - Maximum 1 new Sign per rejected PR

      - name: Invoke Jules to distil guardrail (fallback key)
        if: steps.jules-primary.outcome == 'failure'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY_F }}
          prompt: |
            An agent-generated PR was rejected. Extract the lesson and add it
            as a new guardrail to GUARDRAILS.md.

            ## Rejection Context

            ${{ steps.context.outputs.failure_context }}

            ## Instructions

            1. Read the review comments. Identify the root cause.
            2. Open GUARDRAILS.md, find the highest Sign #N heading.
            3. Append a new Sign block:
               ```
               ## Sign #<N>: <Short imperative title>
               **What happened:** <1-2 sentences>
               **Root cause:** <1 sentence>
               **Rule:** <imperative: "DO NOT...", "ALWAYS USE...", "NEVER...">
               **Source:** PR #${{ steps.context.outputs.pr_number }}, closed ${{ steps.context.outputs.closed_at }}
               ---
               ```
            4. Check for duplicates — if similar exists, amend it instead.
            5. Open a PR on branch `jules/guardrails-sign-<N>`.

            Constraints:
            - Only modify GUARDRAILS.md
            - Keep guardrails precise and actionable
            - Maximum 1 new Sign per rejected PR
