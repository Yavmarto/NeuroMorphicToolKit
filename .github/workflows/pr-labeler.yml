name: PR Labeler

# Automatically labels PRs based on which modules were changed.
# Helps with filtering and changelog generation.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules and apply labels
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          LABELS=""

          # Get changed files
          CHANGED=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || git diff --name-only "origin/${{ github.base_ref }}...HEAD")

          # Map paths to module labels
          echo "$CHANGED" | grep -q '^Neurosim/'          && LABELS="$LABELS,neurosim"
          echo "$CHANGED" | grep -q '^Neurochip/neurochip/' && LABELS="$LABELS,neurochip"
          echo "$CHANGED" | grep -q '^Neurochip/frontend/' && LABELS="$LABELS,neurochip-frontend"
          echo "$CHANGED" | grep -q '^Neurosense/neurosense/' && LABELS="$LABELS,neurosense"
          echo "$CHANGED" | grep -q '^Neurosense/frontend/' && LABELS="$LABELS,neurosense-frontend"
          echo "$CHANGED" | grep -q '^Neurohub/neurohub/'  && LABELS="$LABELS,neurohub"
          echo "$CHANGED" | grep -q '^Neurohub/frontend/'  && LABELS="$LABELS,neurohub-frontend"
          echo "$CHANGED" | grep -q '^Neuro-Dream-Hand/'   && LABELS="$LABELS,neurodreamhand"
          echo "$CHANGED" | grep -q '^neurocnl/'           && LABELS="$LABELS,neurocnl"
          echo "$CHANGED" | grep -q '^Neurobench/'         && LABELS="$LABELS,neurobench"
          echo "$CHANGED" | grep -q '^nmtk_ui_core/'       && LABELS="$LABELS,nmtk-ui-core"
          echo "$CHANGED" | grep -q '^neuro_toolkit/'      && LABELS="$LABELS,neurotoolkit"
          echo "$CHANGED" | grep -q '^\.github/'           && LABELS="$LABELS,ci"

          # Detect if Jules PR
          if echo "${{ github.head_ref }}" | grep -q '^jules/'; then
            LABELS="$LABELS,jules-ai"
          fi

          # Remove leading comma and apply
          LABELS="${LABELS#,}"
          if [ -n "$LABELS" ]; then
            echo "Applying labels: $LABELS"
            gh pr edit "$PR_NUMBER" --add-label "$LABELS" 2>/dev/null || echo "⚠ Some labels may not exist yet — create them in Settings → Labels"
          else
            echo "No module-specific labels to apply"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
