name: nmtk_ui_core
description: "Core UI components for the Neuromorphic Toolkit."
version: 0.6.0+3

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # Shadcn/UI Flutter port — provides ShadApp, ShadThemeData, ShadColorScheme,
  # and the full Shadcn component library. Pin with ^ so minor updates are
  # picked up automatically; bump the major when the team is ready for a
  # breaking-change migration. Run `flutter pub upgrade shadcn_ui` to refresh.
  shadcn_ui: ^0.54.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
