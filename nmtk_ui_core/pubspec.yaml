name: nmtk_ui_core
description: "Core UI components for the Neuromorphic Toolkit."
version: 0.7.0+0
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  nmtk_module_contracts:
    path: ../nmtk_module_contracts
  zeta_flutter: ^1.4.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
  shaders:
    - assets/shaders/raster_plot.frag
    - assets/shaders/spike_field.frag
    - assets/shaders/density_map.frag
