name: nmtk_wgpu_renderer_plugin
description: "macOS-only Flutter texture bridge for the nmtk_wgpu native Rust renderer."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: NmtkWgpuRendererPlugin
