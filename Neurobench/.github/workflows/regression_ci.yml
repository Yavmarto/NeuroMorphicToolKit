name: Regression Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install Dependencies
        working-directory: neurobench
        run: poetry install

      - name: Run Regression Tests
        working-directory: neurobench
        run: |
          # Use a saved baseline.json for comparison
          poetry run python -m cli run spike_classification \
            --network tests/test_network.cnl \
            --baseline tests/baseline.json \
            --threshold 0.5 \
            --fail-on-regression
